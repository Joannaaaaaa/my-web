<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1218">
    <title>웹툰</title>
    <link rel="stylesheet" href="common.css">
    <style>
        body { padding-bottom: calc(72px + var(--safe-bottom)); }
        body.no-scroll { overflow: hidden; }
        .page { max-width: 1000px; margin: auto; padding: 0 16px; }

        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 8px 4px 16px; max-width: 1000px; margin: auto;
        }
        .app-header h1 { font-size: 1.5rem; margin: 0; }
        .app-header .count { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; margin-left: 6px; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 作品列表：固定在上方的搜尋與狀態列 */
        .list-toolbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(15, 18, 24, 0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            margin: 0 -16px; padding: 8px 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .search-row { display: flex; gap: 8px; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap .input { padding-left: 36px; padding-right: 40px; border-radius: 22px; background: var(--card-bg); }
        .search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .search-wrap .clear-btn { position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: none; background: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }
        .filter-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333; background: var(--card-bg); color: var(--text); font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
        .filter-btn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: none; }
        .filter-btn.active .dot { display: block; }

        .status-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .status-scroller::-webkit-scrollbar { display: none; }
        .status-scroller .chip { flex-shrink: 0; min-height: 36px; border-width: 1px; font-size: 0.85rem; }
        .status-scroller .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: none; }

        .result-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); padding: 10px 0; min-height: 44px; }
        .link-btn { background: none; border: none; color: var(--primary); font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 8px 0 8px 12px; }

        /* 作品卡片 */
        .gallery-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 700px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; } }
        .review-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 14px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%;
        }
        .review-card:active { background: var(--raised); }
        @media (hover: hover) { .review-card:hover { border-color: var(--primary); } }
        .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .comic-title { font-size: 1.02rem; font-weight: bold; color: #fff; margin: 0; line-height: 1.35; border-left: 3px solid var(--primary); padding-left: 8px; }
        .comic-kr-title { font-size: 0.8rem; color: #8a94a6; font-style: italic; margin: 2px 0 0 11px; }
        .card-stars { color: var(--star); font-size: 0.85rem; white-space: nowrap; letter-spacing: -1px; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0 11px; }
        .card-creators {
            font-size: 0.8rem; color: var(--text-sub); margin: 6px 0 0 11px; line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-relations { font-size: 0.8rem; color: #58b6ec; margin: 6px 0 0 11px; line-height: 1.55; }
        .card-relations b { font-weight: bold; margin-right: 4px; }
        .card-dates { font-size: 0.72rem; color: #666; margin: 6px 0 0 11px; }
        .empty-msg { text-align: center; color: #555; padding: 50px 0; }

        /* 可收合的區塊（本週頁、統計頁） */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
        .panel-title { font-size: 0.95rem; font-weight: bold; color: var(--primary); margin: 0 0 10px; }

        /* 本週：星期列 + 當天清單 */
        .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
        .day-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            min-height: 56px; border: none; border-radius: 12px; background: transparent; cursor: pointer;
            color: var(--text-sub); font: inherit; position: relative;
        }
        .day-btn .day-name { font-size: 0.95rem; font-weight: bold; }
        .day-btn .day-count { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .day-btn.empty .day-name { color: #4a4f5a; }
        .day-btn.today { box-shadow: inset 0 0 0 1.5px var(--primary); }
        .day-btn.selected { background: var(--primary); color: #fff; }
        .day-btn.selected .day-count { color: rgba(255, 255, 255, 0.85); }
        .day-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .day-heading-title { font-weight: bold; font-size: 1rem; }
        .day-heading-sub { font-size: 0.8rem; color: var(--text-muted); }
        .day-list { touch-action: pan-y; min-height: 120px; }
        .day-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-height: 60px;
            border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .day-item:last-child { border-bottom: none; }
        .day-item:active { background: var(--raised); }
        .day-item-dots { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
        .day-item-dots span { width: 8px; height: 8px; border-radius: 50%; }
        .day-item-main { flex: 1; min-width: 0; }
        .day-item-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-item-kr { font-size: 0.8rem; color: #8a94a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-item-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; flex-shrink: 0; max-width: 45%; }
        .read-check {
            width: 44px; height: 44px; margin: -6px -6px -6px -10px; flex-shrink: 0; border: none; background: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
        }
        .read-check span {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid #555; color: transparent;
            display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold;
        }
        .read-check.on span { background: var(--status-ongoing); border-color: var(--status-ongoing); color: #fff; }
        .day-item.read .day-item-title, .day-item.read .day-item-kr { opacity: 0.45; }
        .day-item-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.8rem; color: var(--text-sub); }
        .ep-plus {
            min-height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--primary);
            background: transparent; color: var(--primary); font-size: 0.78rem; font-weight: bold; cursor: pointer; position: relative;
        }
        .ep-plus::after { content: ''; position: absolute; inset: -7px -4px; } /* 放大點擊範圍 */
        .ep-plus:active { background: rgba(52, 152, 219, 0.15); }
        .ep-chip { font-size: 0.75rem; color: var(--text-sub); background: var(--raised); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }

        .toast {
            position: fixed; left: 16px; right: 16px; bottom: calc(140px + var(--safe-bottom)); z-index: 200;
            max-width: 480px; margin: auto; display: flex; align-items: center; gap: 12px;
            padding: 10px 10px 10px 16px; border-radius: 12px; background: #2b303a; color: var(--text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); font-size: 0.9rem; animation: slideUp 0.2s ease-out;
        }
        .toast span { flex: 1; }
        .toast button { min-height: 40px; padding: 0 12px; border: none; background: none; color: var(--primary); font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .day-empty { color: var(--text-muted); text-align: center; padding: 36px 0; font-size: 0.9rem; }
        .memo-panel .panel-title { color: var(--text-sub); }
        .memo-textarea { width: 100%; min-height: 120px; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.6; resize: none; padding: 0; }
        .memo-textarea:focus { outline: none; }

        /* 統計圖表 */
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
        .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .kpi-label { font-size: 0.8rem; color: var(--text-muted); }
        .kpi-value { font-size: 1.7rem; font-weight: 600; line-height: 1.2; margin-top: 2px; }
        .kpi-value small { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-left: 2px; }
        .panel-sub { font-size: 0.78rem; color: var(--text-muted); margin: -6px 0 12px; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .bar-row { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; min-height: 40px; }
        .bar-row + .bar-row { margin-top: 4px; }
        .bar-row.overall { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
        .bar-label { font-size: 0.82rem; color: var(--text-sub); white-space: nowrap; }
        /* 右側預留空間給長條尾端的總數 */
        .bar-track { display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 34px; }
        .bar-stack { display: flex; gap: 2px; height: 22px; flex-shrink: 0; }
        .bar-seg {
            height: 100%; border: none; padding: 0; cursor: pointer; flex: 0 1 auto; min-width: 4px;
            color: #fff; font-size: 0.72rem; font-weight: bold; overflow: visible;
            position: relative;
        }
        .bar-seg:last-child { border-radius: 0 4px 4px 0; }
        .bar-seg.dim { opacity: 0.35; }
        .bar-seg::after { content: ''; position: absolute; inset: -9px 0; } /* 放大點擊範圍 */
        .bar-total { font-size: 0.8rem; color: var(--text-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .chart-info { min-height: 40px; margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--raised); font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; }
        .chart-empty { color: #555; text-align: center; padding: 20px 0; }
        .stars-label { color: var(--star); letter-spacing: -1px; font-size: 0.78rem; }
        .chart-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
        .chart-chips::-webkit-scrollbar { display: none; }
        .chart-chips .chip { min-height: 34px; font-size: 0.8rem; border-width: 1px; flex-shrink: 0; }
        .chart-chips .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: none; }
        .table-details summary { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; padding: 12px 0 4px; min-height: 44px; }
        .table-details .table-scroll + .table-scroll { margin-top: 12px; }

        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .stats-table { width: 100%; min-width: 300px; border-collapse: collapse; font-size: 0.85rem; text-align: center; }
        .stats-table th { background: var(--raised); color: #a1a1aa; padding: 8px 4px; border: 1px solid var(--border); }
        .stats-table td { padding: 8px 4px; border: 1px solid var(--border); }
        .stats-table .row-head { font-weight: bold; color: var(--primary); white-space: nowrap; }
        .stats-table .zero { color: #444; }
        .stats-table .total-row td { background: var(--raised); font-weight: bold; }

        /* 底部分頁列與新增按鈕 */
        .tab-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; background: rgba(21, 24, 31, 0.97); border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
        }
        .tab-bar button {
            flex: 1; height: 56px; border: none; background: none; color: var(--text-muted); cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.72rem;
        }
        .tab-bar button .tab-icon { font-size: 1.25rem; line-height: 1; filter: grayscale(1); opacity: 0.6; }
        .tab-bar button.active { color: var(--primary); font-weight: bold; }
        .tab-bar button.active .tab-icon { filter: none; opacity: 1; }
        .fab {
            position: fixed; right: 16px; bottom: calc(72px + var(--safe-bottom)); z-index: 30;
            width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff;
            font-size: 2rem; line-height: 56px; text-align: center; text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        /* 彈出視窗：底部選單 (sheet) 與全螢幕詳細頁 (fullsheet) */
        .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; display: none; }
        .backdrop.open { display: block; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; display: none;
            max-height: 85vh; overflow-y: auto; background: var(--card-bg); border-radius: 16px 16px 0 0;
            padding: 8px 16px calc(16px + var(--safe-bottom)); max-width: 640px; margin: auto;
        }
        .sheet.open { display: block; animation: slideUp 0.2s ease-out; }
        .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: #444; margin: 4px auto 12px; }
        .sheet h3 { margin: 0 0 12px; font-size: 1rem; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 8px;
            border: none; background: none; color: var(--text); font-size: 1rem; text-align: left; cursor: pointer;
            border-radius: 10px; text-decoration: none;
        }
        .menu-item:active { background: var(--raised); }
        .menu-item.danger { color: var(--danger); }
        .menu-divider { height: 1px; background: var(--border); margin: 6px 0; }
        .sheet .form-section:last-child { margin-bottom: 0; }

        .fullsheet {
            position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
            background: var(--bg);
        }
        .fullsheet.open { display: flex; animation: slideUp 0.22s ease-out; }
        @media (min-width: 700px) {
            .fullsheet { inset: 4vh 0; max-width: 680px; margin: 0 auto; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
        }
        .fullsheet-header {
            display: flex; align-items: center; gap: 4px; padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top, 0px));
            border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
        }
        .fullsheet-header .sheet-title { flex: 1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fullsheet-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .fullsheet-footer {
            display: flex; gap: 10px; padding: 10px 16px calc(10px + var(--safe-bottom));
            border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
        }
        .fullsheet-footer .btn { min-height: 48px; }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }

        /* 詳細頁內容 */
        .detail-title { font-size: 1.4rem; margin: 0; line-height: 1.3; }
        .detail-kr { color: #8a94a6; font-style: italic; margin-top: 4px; }
        .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
        .open-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .open-link {
            display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px;
            border-radius: 10px; background: var(--raised); border: 1px solid var(--border);
            color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: bold;
        }
        .open-link:active { background: var(--border); }
        .open-link .swatch { width: 10px; height: 10px; border-radius: 3px; }
        .open-link-icon { color: var(--text-muted); font-size: 0.85rem; }
        .detail-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 0.95rem; }
        .detail-stars { color: var(--star); font-size: 1.3rem; letter-spacing: 1px; }
        .detail-dates { display: flex; gap: 16px; font-size: 0.85rem; margin-bottom: 12px; }
        .comment-text { font-size: 1rem; color: var(--text-sub); line-height: 1.7; white-space: pre-wrap; word-break: break-word; background: var(--raised); padding: 12px 14px; border-radius: 10px; }
        .detail-section-title { font-size: 0.85rem; color: var(--text-muted); font-weight: bold; margin: 20px 0 8px; }
        .creator-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 0.92rem; }
        .creator-list dt { color: var(--text-muted); white-space: nowrap; }
        .creator-list dd { margin: 0; color: var(--text); }
        .relation-group { margin-bottom: 10px; font-size: 0.9rem; }
        .relation-group .label { color: #58b6ec; font-weight: bold; margin-right: 4px; }
        .relation-link { border: none; background: rgba(88, 182, 236, 0.12); color: #9fd4f5; border-radius: 6px; padding: 4px 8px; margin: 3px 4px 3px 0; font-size: 0.85rem; cursor: pointer; }
    </style>
</head>
<body>

<header class="app-header">
    <h1>웹툰<span class="count" id="totalCount"></span></h1>
    <button class="icon-btn" onclick="Sheets.open('menuSheet')" aria-label="更多功能">⋯</button>
</header>

<main class="page">
    <!-- 作品列表 -->
    <section class="tab-panel" id="tab-list">
        <div class="list-toolbar">
            <div class="search-row">
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="search" id="searchInput" class="input" placeholder="搜尋作品、創作者、評論" oninput="renderList()" enterkeyhint="search">
                    <button class="clear-btn" id="searchClear" onclick="clearSearch()" aria-label="清除搜尋" hidden>✕</button>
                </div>
                <button class="filter-btn" id="filterBtn" onclick="Sheets.open('filterSheet')" aria-label="篩選與排序">⇅<span class="dot"></span></button>
            </div>
            <div class="status-scroller" id="statusChips"></div>
        </div>
        <div class="result-bar">
            <span id="resultCount"></span>
            <button class="link-btn" id="resetFiltersBtn" onclick="resetFilters()" hidden>清除篩選</button>
        </div>
        <div id="gallery" class="gallery-grid"></div>
        <div id="emptyMsg" class="empty-msg" hidden>目前沒有符合條件的作品</div>
    </section>

    <!-- 本週更新 + 備忘錄 -->
    <section class="tab-panel" id="tab-weekly">
        <div class="panel">
            <div class="day-strip" id="dayStrip" role="tablist" aria-label="選擇星期"></div>
            <div class="day-heading">
                <span class="day-heading-title" id="dayHeadingTitle"></span>
                <span class="day-heading-sub" id="dayHeadingSub"></span>
            </div>
            <div class="day-list" id="dayList"></div>
        </div>
        <div class="panel memo-panel">
            <div class="panel-title">📝 備忘錄</div>
            <textarea id="memoArea" class="memo-textarea" placeholder="在此輸入日期備忘錄...&#10;例如：Merry phsycho 5/19 (二) webtoon"></textarea>
        </div>
    </section>

    <!-- 統計 -->
    <section class="tab-panel" id="tab-stats">
        <div class="kpi-grid" id="kpiGrid"></div>
        <div class="panel">
            <div class="panel-title">各平台閱讀狀態</div>
            <div class="panel-sub">一部作品在多個平台時，每個平台都會算一次</div>
            <div class="legend" id="statusLegend"></div>
            <div id="statusChart"></div>
            <div class="chart-info" id="statusInfo"></div>
        </div>
        <div class="panel">
            <div class="panel-title">評分分布</div>
            <div class="chart-chips" id="ratingPlatformChips"></div>
            <div id="ratingChart"></div>
            <div class="chart-info" id="ratingInfo"></div>
        </div>
        <details class="table-details">
            <summary>查看數字表格</summary>
            <div class="table-scroll"><table class="stats-table" id="statusStatsTable"></table></div>
            <div class="table-scroll"><table class="stats-table" id="ratingStatsTable"></table></div>
        </details>
    </section>
</main>

<a class="fab" href="add.html" aria-label="新增漫畫">＋</a>

<nav class="tab-bar">
    <button data-tab="list" onclick="switchTab('list')"><span class="tab-icon">📚</span>作品</button>
    <button data-tab="weekly" onclick="switchTab('weekly')"><span class="tab-icon">📅</span>本週</button>
    <button data-tab="stats" onclick="switchTab('stats')"><span class="tab-icon">📊</span>統計</button>
</nav>

<div class="backdrop" id="backdrop" onclick="Sheets.closeTop()"></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction">復原</button></div>

<div class="sheet" id="menuSheet">

    <button class="menu-item" onclick="downloadBackup()">💾 下載備份</button>
    <button class="menu-item" onclick="document.getElementById('filePicker').click()">📤 匯入備份</button>
    <a class="menu-item" href="platform-comments.html">💬 查詢平台留言</a>
    <div class="menu-divider"></div>
    <button class="menu-item danger" onclick="clearAllData()">🗑️ 清除全部資料</button>

<input type="file" id="filePicker" accept=".json,application/json" multiple hidden>

<!-- 篩選與排序 -->
<div class="sheet" id="filterSheet">
    <div class="sheet-handle"></div>
    <h3>篩選與排序</h3>
    <div class="form-section">
        <label class="form-label" for="sortSelect">排序</label>
        <select id="sortSelect" class="input" onchange="onFilterChange()">
            <option value="added">新增順序（舊→新）</option>
            <option value="added-desc">新增順序（新→舊）</option>
            <option value="updated">最近編輯</option>
            <option value="rating">評分（高→低）</option>
            <option value="start">開始日（新→舊）</option>
            <option value="end">結束日（新→舊）</option>
            <option value="title">標題</option>
        </select>
    </div>
    <div class="form-section">
        <label class="form-label" for="platformFilter">平台</label>
        <select id="platformFilter" class="input" onchange="onFilterChange()"></select>
    </div>
    <div class="form-section">
        <label class="form-label" for="studioFilter">製作團隊</label>
        <select id="studioFilter" class="input" onchange="onFilterChange()"></select>

        <button class="btn btn-primary" onclick="Sheets.closeTop()">完成</button>

<!-- 作品詳細 / 編輯 -->
<div class="fullsheet" id="detailSheet">
    <div class="fullsheet-header">
        <button class="icon-btn" onclick="Sheets.closeTop()" aria-label="關閉">✕</button>
        <div class="sheet-title" id="detailHeaderTitle"></div>
        <button class="btn btn-primary" id="editModeBtn" onclick="enterEditMode()" style="min-height:38px;">✏️ 編輯</button>
    </div>
    <div class="fullsheet-body" id="detailBody">
        <div id="viewModeArea"></div>
        <div id="editModeArea" hidden></div>
    </div>
    <div class="fullsheet-footer" id="editFooter" hidden>
        <button class="btn btn-ghost" style="color: var(--danger);" onclick="deleteCurrentReview()">刪除</button>
        <button class="btn" style="flex:1;" onclick="cancelEdit()">取消</button>
        <button class="btn btn-primary" style="flex:2;" onclick="saveChanges()">儲存</button>

<script src="common.js"></script>
<script>
    let allReviews = Store.loadReviews();
    const ui = Object.assign({ tab: 'list', status: 'all', platform: 'all', studio: 'all', sort: 'added' }, Store.loadUi());
    let currentEditIndex = -1;
    let isEditMode = false;

    const editForm = createReviewForm(document.getElementById('editModeArea'));

    // ---------- 彈出視窗管理：支援手機返回手勢關閉 ----------
    const Sheets = {
        stack: [],
        guards: {},
        open(id) {
            if (this.stack.includes(id)) return;
            this.stack.push(id);
            this.show(id, true);
            history.pushState({ sheet: id }, '');
        },
        closeTop() {
            if (this.stack.length) history.back();
        },
        // 瀏覽器返回時呼叫；guard 回傳 false 代表使用者取消關閉
        onPopState() {
            const id = this.stack[this.stack.length - 1];
            if (!id) return;
            if (this.guards[id] && !this.guards[id]()) {
                history.pushState({ sheet: id }, '');
                return;
            }
            this.stack.pop();
            this.show(id, false);
        },
        show(id, visible) {
            document.getElementById(id).classList.toggle('open', visible);
            const anyBottomSheet = this.stack.some(s => document.getElementById(s).classList.contains('sheet'));
            document.getElementById('backdrop').classList.toggle('open', anyBottomSheet || (this.stack.length > 0 && window.innerWidth >= 700));
            document.body.classList.toggle('no-scroll', this.stack.length > 0);
        },
    };
    window.addEventListener('popstate', () => Sheets.onPopState());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') Sheets.closeTop(); });
    Sheets.guards.detailSheet = () => !(isEditMode && editForm.isDirty()) || confirm('尚未儲存的修改會遺失，確定要離開嗎？');

    // ---------- 分頁 ----------
    function switchTab(tab) {
        ui.tab = tab;
        Store.saveUi(ui);
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'weekly') autoResizeMemo();
        window.scrollTo(0, 0);
    }

    // ---------- 篩選 ----------
    function buildFilterOptions() {
        const platformCounts = {};
        const studios = new Set();
        allReviews.forEach(r => {
            (r.platforms || []).forEach(p => { platformCounts[p.trim()] = (platformCounts[p.trim()] || 0) + 1; });
            splitNames(r.studio).forEach(s => studios.add(s));
        });

        const platformSelect = document.getElementById('platformFilter');
        platformSelect.innerHTML = '<option value="all">所有平台</option>' +
            Object.keys(platformCounts).sort().map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}（${platformCounts[p]} 部）</option>`).join('');
        const studioSelect = document.getElementById('studioFilter');
        studioSelect.innerHTML = '<option value="all">所有製作團隊</option>' +
            Array.from(studios).sort().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

        // 保存的篩選值若已不存在（例如刪掉最後一部），就回到「全部」
        const has = (sel, v) => Array.from(sel.options).some(o => o.value === v);
        if (!has(platformSelect, ui.platform)) ui.platform = 'all';
        if (!has(studioSelect, ui.studio)) ui.studio = 'all';
        platformSelect.value = ui.platform;
        studioSelect.value = ui.studio;
        document.getElementById('sortSelect').value = ui.sort;
    }

    function renderStatusChips() {
        const counts = { all: allReviews.length };
        STATUSES.forEach(s => { counts[s] = allReviews.filter(r => (r.status || DEFAULT_STATUS) === s).length; });
        document.getElementById('statusChips').innerHTML = ['all', ...STATUSES].map(s => `
            <button class="chip ${ui.status === s ? 'selected' : ''}" onclick="setStatusFilter('${s}')">
                ${s === 'all' ? '全部' : s} ${counts[s]}
            </button>`).join('');
    }

    function setStatusFilter(status) {
        ui.status = status;
        Store.saveUi(ui);
        renderStatusChips();
        renderList();
    }

    function onFilterChange() {
        ui.platform = document.getElementById('platformFilter').value;
        ui.studio = document.getElementById('studioFilter').value;
        ui.sort = document.getElementById('sortSelect').value;
        Store.saveUi(ui);
        renderList();
    }

    function resetFilters() {
        Object.assign(ui, { status: 'all', platform: 'all', studio: 'all', sort: 'added' });
        Store.saveUi(ui);
        document.getElementById('searchInput').value = '';
        buildFilterOptions();
        renderStatusChips();
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        renderList();
        input.focus();
    }

    const SEARCH_FIELDS = ['title', 'krTitle', 'comment', ...JOB_KEYS.map(j => j.key)];

    function getFilteredIndexes() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const indexes = allReviews.map((_, i) => i).filter(i => {
            const r = allReviews[i];
            if (ui.status !== 'all' && (r.status || DEFAULT_STATUS) !== ui.status) return false;
            if (ui.platform !== 'all' && !(r.platforms || []).includes(ui.platform)) return false;
            if (ui.studio !== 'all' && !splitNames(r.studio).includes(ui.studio)) return false;
            if (query && !SEARCH_FIELDS.some(f => (r[f] || '').toLowerCase().includes(query))) return false;
            return true;
        });

        const by = {
            'added-desc': (a, b) => b - a,
            'updated': (a, b) => (allReviews[b].updatedAtTs || 0) - (allReviews[a].updatedAtTs || 0) || b - a,
            'rating': (a, b) => (allReviews[b].rating || 0) - (allReviews[a].rating || 0),
            'start': (a, b) => (allReviews[b].startDate || '').localeCompare(allReviews[a].startDate || ''),
            'end': (a, b) => (allReviews[b].endDate || '').localeCompare(allReviews[a].endDate || ''),
            'title': (a, b) => (allReviews[a].title || '').localeCompare(allReviews[b].title || '', 'zh-Hant'),
        }[ui.sort];
        return by ? indexes.sort(by) : indexes;
    }

    // ---------- 作品列表 ----------
    function creatorsSummary(r) {
        return JOB_KEYS.filter(j => (r[j.key] || '').trim())
            .map(j => `<b>${j.label}</b> ${escapeHtml(r[j.key].trim())}`).join(' · ');
    }

    function statusBadgeHtml(r) {
        const status = r.status || DEFAULT_STATUS;
        const day = status === DEFAULT_STATUS && DAY_MAP[r.updateDay] ? ` · ${DAY_MAP[r.updateDay]}` : '';
        return `<span class="status-badge ${STATUS_CONFIG[status]?.cls || 'status-ongoing'}">${escapeHtml(status)}${day}</span>`;
    }

    function renderList() {
        const query = document.getElementById('searchInput').value;
        document.getElementById('searchClear').hidden = !query;

        const indexes = getFilteredIndexes();
        const filtersActive = ui.status !== 'all' || ui.platform !== 'all' || ui.studio !== 'all' || query.trim() !== '';
        document.getElementById('filterBtn').classList.toggle('active', ui.platform !== 'all' || ui.studio !== 'all' || ui.sort !== 'added');
        document.getElementById('resetFiltersBtn').hidden = !(filtersActive || ui.sort !== 'added');
        document.getElementById('resultCount').textContent = filtersActive
            ? `顯示 ${indexes.length} / ${allReviews.length} 部`
            : `共 ${allReviews.length} 部`;
        document.getElementById('totalCount').textContent = allReviews.length ? `${allReviews.length} 部` : '';

        document.getElementById('gallery').innerHTML = indexes.map(i => {
            const r = allReviews[i];
            const dates = [r.startDate && `시작 ${escapeHtml(r.startDate)}`, r.endDate && `끝 ${escapeHtml(r.endDate)}`].filter(Boolean).join('　');
            const creators = creatorsSummary(r);
            const relations = findRelations(r).map(g =>
                `<div><b>🔗 ${g.label}</b>${escapeHtml(g.matches.map(m => m.title).join('、'))}</div>`).join('');
            return `
                <article class="review-card" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if (event.key === 'Enter') openDetail(${i})">
                    <div class="card-top">
                        <div style="min-width:0;">
                            <h3 class="comic-title">${escapeHtml(r.title || '未命名')}</h3>
                            ${r.krTitle ? `<div class="comic-kr-title">${escapeHtml(r.krTitle)}</div>` : ''}
                        </div>
                        <div class="card-stars">${starsText(r.rating)}</div>
                    </div>
                    <div class="card-meta">${statusBadgeHtml(r)} ${episodeText(r) ? `<span class="ep-chip">${episodeText(r)}</span>` : ''} ${platformLinkTagsHtml(r)}</div>
                    ${creators ? `<div class="card-creators">${creators}</div>` : ''}
                    ${relations ? `<div class="card-relations">${relations}</div>` : ''}
                    ${dates ? `<div class="card-dates">${dates}</div>` : ''}
                </article>`;
        }).join('');
        document.getElementById('emptyMsg').hidden = indexes.length > 0;
    }

    // ---------- 本週更新 ----------
    const DAY_FULL = { Mon: '월요일', Tue: '화요일', Wed: '수요일', Thu: '목요일', Fri: '금요일', Sat: '토요일', Sun: '일요일' };
    const DAY_ZH = { Mon: '週一', Tue: '週二', Wed: '週三', Thu: '週四', Fri: '週五', Sat: '週六', Sun: '週日' };
    const todayCode = () => DAYS[(new Date().getDay() + 6) % 7];
    let selectedDay = todayCode();

    function comicsOn(day) {
        return allReviews.map((r, i) => ({ r, i }))
            .filter(({ r }) => (r.status || DEFAULT_STATUS) === DEFAULT_STATUS && r.updateDay === day);
    }

    function renderWeekly() {
        const today = todayCode();
        document.getElementById('dayStrip').innerHTML = DAYS.map(day => {
            const list = comicsOn(day);
            const n = list.length;
            const allRead = n > 0 && list.every(({ r }) => isReadThisWeek(r));
            const cls = [day === today && 'today', day === selectedDay && 'selected', !n && 'empty'].filter(Boolean).join(' ');
            return `<button class="day-btn ${cls}" role="tab" aria-selected="${day === selectedDay}" onclick="selectDay('${day}')">
                <span class="day-name">${DAY_MAP[day]}</span><span class="day-count">${allRead ? '✓' : (n || '·')}</span></button>`;
        }).join('');

        const items = comicsOn(selectedDay);
        const readCount = items.filter(({ r }) => isReadThisWeek(r)).length;
        document.getElementById('dayHeadingTitle').textContent =
            `${DAY_FULL[selectedDay]}${selectedDay === today ? '・今天' : ''}`;
        document.getElementById('dayHeadingSub').textContent = items.length ? `${items.length} 部更新・已讀 ${readCount}` : '';
        document.getElementById('dayList').innerHTML = items.length ? items.map(({ r, i }) => {
            const read = isReadThisWeek(r);
            return `
            <div class="day-item ${read ? 'read' : ''}" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if (event.key === 'Enter') openDetail(${i})">
                <button class="read-check ${read ? 'on' : ''}" onclick="event.stopPropagation(); toggleRead(${i})" aria-label="${read ? '標為未讀' : '標為已讀'}" aria-pressed="${read}"><span>✓</span></button>
                <div class="day-item-dots">${(r.platforms || []).map(p => `<span style="background: ${platformColor(p)}"></span>`).join('')}</div>
                <div class="day-item-main">
                    <div class="day-item-title">${escapeHtml(cleanTitleBrackets(r.title) || '未命名')}</div>
                    ${r.krTitle ? `<div class="day-item-kr">${escapeHtml(r.krTitle)}</div>` : ''}
                    <div class="day-item-progress">${progressControlsHtml(r, i)}</div>
                </div>
                <div class="day-item-links">${platformLinkTagsHtml(r)}</div>
            </div>`;
        }).join('')
            : `<div class="day-empty">${DAY_ZH[selectedDay]}沒有連載中的作品</div>`;
    }

    // ---------- 閱讀進度 ----------
    function progressControlsHtml(r, i) {
        return Number.isInteger(r.episode)
            ? `<span>${episodeText(r)}</span><button class="ep-plus" onclick="event.stopPropagation(); addEpisode(${i})">+1 話</button>`
            : `<button class="ep-plus" onclick="event.stopPropagation(); addEpisode(${i})">記錄話數</button>`;
    }

    // 看完一話：話數 +1，並把本週這部標為已讀
    function addEpisode(i) {
        const r = allReviews[i];
        const before = { episode: r.episode, lastReadDate: r.lastReadDate };
        if (Number.isInteger(r.episode)) {
            r.episode += 1;
        } else {
            const input = prompt(`《${cleanTitleBrackets(r.title)}》看到第幾話？`);
            const n = parseInt(input);
            if (!Number.isInteger(n) || n < 0) return;
            r.episode = n;
        }
        if (r.updateDay) r.lastReadDate = weekDateOf(r.updateDay);
        saveProgress();
        showToast(`《${cleanTitleBrackets(r.title)}》看到${episodeText(r)}`, () => {
            Object.assign(r, before);
            saveProgress();
        });
    }

    function toggleRead(i) {
        const r = allReviews[i];
        r.lastReadDate = isReadThisWeek(r) ? '' : weekDateOf(r.updateDay);
        saveProgress();
    }

    // 進度變更不算「編輯」，所以不更新 updatedAt（避免打亂「最近編輯」排序）
    function saveProgress() {
        Store.saveReviews(allReviews);
        renderList();
        renderWeekly();
        if (currentEditIndex >= 0 && document.getElementById('detailSheet').classList.contains('open') && !isEditMode) {
            renderDetailView(currentEditIndex);
        }
    }

    let toastTimer;
    function showToast(text, undo) {
        const toast = document.getElementById('toast');
        document.getElementById('toastText').textContent = text;
        const action = document.getElementById('toastAction');
        action.hidden = !undo;
        action.onclick = () => { toast.hidden = true; undo(); };
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 4000);
    }

    function selectDay(day) {
        selectedDay = day;
        renderWeekly();
    }

    // 在清單上左右滑動切換前一天 / 後一天
    (() => {
        const list = document.getElementById('dayList');
        let startX = null, startY = null;
        list.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
        list.addEventListener('touchend', e => {
            if (startX === null) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            startX = null;
            if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const idx = DAYS.indexOf(selectedDay);
            selectDay(DAYS[(idx + (dx < 0 ? 1 : 6)) % 7]);
        });
    })();

    // ---------- 統計 ----------
    // 堆疊順序讓相鄰色塊在色盲下也能區分（紫色的休刊不緊鄰藍色的已看完、粉紅的想看不緊鄰綠色的連載中）
    const CHART_STATUS_ORDER = ['連載中', '已看完', '想看', '棄坑', '休刊'];
    let ratingPlatform = 'all';

    const statusOf = r => STATUS_CONFIG[r.status] ? r.status : DEFAULT_STATUS;
    const onPlatform = (r, p) => p === 'all' || (r.platforms || []).includes(p);
    const pct = (n, total) => total ? Math.round(n / total * 100) : 0;

    function renderStats() {
        renderKpis();
        renderStatusChart();
        renderRatingChart();
        renderStatsTables();
    }

    function renderKpis() {
        const rated = allReviews.filter(r => parseInt(r.rating) > 0);
        const avg = rated.length ? (rated.reduce((sum, r) => sum + parseInt(r.rating), 0) / rated.length).toFixed(1) : '–';
        const count = s => allReviews.filter(r => statusOf(r) === s).length;
        const tiles = [
            ['作品總數', allReviews.length, '部'],
            ['平均評分', avg, rated.length ? `/ 5（${rated.length} 部）` : ''],
            ['連載中', count('連載中'), '部'],
            ['已看完', count('已看完'), '部'],
        ];
        document.getElementById('kpiGrid').innerHTML = tiles.map(([label, value, unit]) => `
            <div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}<small>${unit}</small></div></div>`).join('');
    }

    // 一列水平長條：segments = [{ value, color, tip }]，寬度相對於 max
    // 單一長條只在尾端標數字；堆疊長條的色塊夠寬才在裡面標數字
    function barRowHtml(label, segments, max, extraClass = '') {
        const total = segments.reduce((sum, s) => sum + s.value, 0);
        const visible = segments.filter(s => s.value > 0);
        const stackWidth = max ? total / max * 100 : 0;
        const segs = visible.map(s => {
            const share = s.value / max * 100;
            const inner = segments.length > 1 && share >= 9 ? s.value : '';
            return `<button class="bar-seg" style="flex-basis: ${s.value / total * 100}%; background: ${s.color};" data-tip="${escapeHtml(s.tip)}" aria-label="${escapeHtml(s.tip)}">${inner}</button>`;
        }).join('');
        return `
            <div class="bar-row ${extraClass}">
                <span class="bar-label">${label}</span>
                <div class="bar-track">
                    <div class="bar-stack" style="width: ${stackWidth}%;">${segs}</div>
                    <span class="bar-total">${total}</span>
                </div>
            </div>`;
    }

    function renderStatusChart() {
        document.getElementById('statusLegend').innerHTML = CHART_STATUS_ORDER.map(s =>
            `<span class="legend-item"><span class="swatch" style="background: ${STATUS_CONFIG[s].color}"></span>${s}</span>`).join('');

        const rows = [{ key: 'all', label: '全部' }, ...PLATFORMS.map(p => ({ key: p, label: PLATFORM_CONFIG[p].short }))];
        const data = rows.map(row => {
            const list = allReviews.filter(r => onPlatform(r, row.key));
            const segments = CHART_STATUS_ORDER.map(s => {
                const n = list.filter(r => statusOf(r) === s).length;
                return { value: n, color: STATUS_CONFIG[s].color, tip: `${row.label} · ${s}：${n} 部（佔 ${pct(n, list.length)}%）` };
            });
            return { ...row, segments, total: list.length };
        });
        const max = Math.max(...data.map(d => d.total));
        document.getElementById('statusChart').innerHTML = max
            ? data.map(d => barRowHtml(d.label, d.segments, max, d.key === 'all' ? 'overall' : '')).join('')
            : '<div class="chart-empty">還沒有資料</div>';
        setChartInfo('statusInfo', max ? '點長條查看各狀態的數量' : '');
    }

    function renderRatingChart() {
        document.getElementById('ratingPlatformChips').innerHTML = ['all', ...PLATFORMS].map(p => `
            <button class="chip ${ratingPlatform === p ? 'selected' : ''}" onclick="setRatingPlatform('${p}')">
                ${p === 'all' ? '全部平台' : PLATFORM_CONFIG[p].short}
            </button>`).join('');

        const list = allReviews.filter(r => onPlatform(r, ratingPlatform));
        const rated = list.filter(r => parseInt(r.rating) > 0);
        const counts = [5, 4, 3, 2, 1].map(n => ({ n, value: list.filter(r => parseInt(r.rating) === n).length }));
        const max = Math.max(...counts.map(c => c.value));
        document.getElementById('ratingChart').innerHTML = max
            ? counts.map(c => barRowHtml(`<span class="stars-label">${'★'.repeat(c.n)}</span>`,
                [{ value: c.value, color: 'var(--star)', tip: `${c.n} 星：${c.value} 部（佔已評分的 ${pct(c.value, rated.length)}%）` }], max)).join('')
            : '<div class="chart-empty">這個平台還沒有評分</div>';
        const unrated = list.length - rated.length;
        setChartInfo('ratingInfo', max ? `點長條查看比例${unrated ? `・另有 ${unrated} 部未評分` : ''}` : '');
    }

    function setRatingPlatform(p) {
        ratingPlatform = p;
        renderRatingChart();
    }

    function setChartInfo(id, text) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.hidden = !text;
    }

    // 點（或滑過）長條時，在下方顯示數字並淡化其他色塊
    function highlightSegment(seg) {
        const panel = seg.closest('.panel');
        panel.querySelectorAll('.bar-seg').forEach(b => b.classList.toggle('dim', b !== seg));
        panel.querySelector('.chart-info').textContent = seg.dataset.tip;
    }
    document.getElementById('tab-stats').addEventListener('click', e => {
        const seg = e.target.closest('.bar-seg');
        if (seg) highlightSegment(seg);
    });
    document.getElementById('tab-stats').addEventListener('mouseover', e => {
        const seg = e.target.closest('.bar-seg');
        if (seg && matchMedia('(hover: hover)').matches) highlightSegment(seg);
    });

    function renderStatsTables() {
        const head = `<tr><th></th>${PLATFORMS.map(p => `<th>${PLATFORM_CONFIG[p].short}</th>`).join('')}</tr>`;
        const cell = n => `<td class="${n === 0 ? 'zero' : ''}">${n}</td>`;
        const count = (pred, p) => allReviews.filter(r => (r.platforms || []).includes(p) && pred(r)).length;

        const statusRows = STATUSES.map(s =>
            `<tr><td class="row-head">${s}</td>${PLATFORMS.map(p => cell(count(r => statusOf(r) === s, p))).join('')}</tr>`).join('');
        const totalRow = `<tr class="total-row"><td class="row-head">Total</td>${PLATFORMS.map(p => `<td>${count(() => true, p)}</td>`).join('')}</tr>`;
        document.getElementById('statusStatsTable').innerHTML = head + statusRows + totalRow;

        const ratingRows = [5, 4, 3, 2, 1].map(n =>
            `<tr><td class="row-head" style="color: var(--star);">${'★'.repeat(n)}</td>${PLATFORMS.map(p => cell(count(r => parseInt(r.rating) === n, p))).join('')}</tr>`).join('');
        document.getElementById('ratingStatsTable').innerHTML = head + ratingRows;
    }

    // ---------- 詳細頁 ----------
    function findRelations(review) {
        const groups = [];
        JOB_KEYS.forEach(job => {
            const names = splitNames(review[job.key]);
            if (!names.length) return;
            const seen = new Set();
            const matches = [];
            allReviews.forEach((other, i) => {
                if (other === review || other.title === review.title) return;
                if (!splitNames(other[job.key]).some(n => names.includes(n))) return;
                const title = cleanTitleBrackets(other.title);
                if (title && !seen.has(title)) { seen.add(title); matches.push({ title, index: i }); }
            });
            if (matches.length) groups.push({ label: job.label, matches });
        });
        return groups;
    }

    function renderDetailView(index) {
        const r = allReviews[index];
        const creators = JOB_KEYS.filter(j => (r[j.key] || '').trim())
            .map(j => `<dt>${j.label}</dt><dd>${escapeHtml(r[j.key].trim())}</dd>`).join('');
        const relations = findRelations(r).map(g => `
            <div class="relation-group"><span class="label">${g.label}</span>
                ${g.matches.map(m => `<button class="relation-link" onclick="openDetail(${m.index}, true)">${escapeHtml(m.title)}</button>`).join('')}
            </div>`).join('');

        const openLinks = (r.platforms || []).map(p => {
            const link = platformLink(r, p);
            if (!link) return '';
            return `<a class="open-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener" style="--tag-color: ${platformColor(p)}">
                <span class="swatch" style="background: ${platformColor(p)}"></span>
                ${link.isSearch ? `在 ${escapeHtml(p)} 搜尋` : `到 ${escapeHtml(p)} 看`}<span class="open-link-icon">${link.isSearch ? '🔍' : '↗'}</span></a>`;
        }).join('');

        document.getElementById('detailHeaderTitle').textContent = r.title || '未命名';
        document.getElementById('viewModeArea').innerHTML = `
            <h2 class="detail-title">${escapeHtml(r.title || '未命名')}</h2>
            ${r.krTitle ? `<div class="detail-kr">원제: ${escapeHtml(r.krTitle)}</div>` : ''}
            <div class="detail-meta">${statusBadgeHtml(r)} ${openLinks ? '' : platformTagsHtml(r.platforms)}</div>
            ${openLinks ? `<div class="open-links">${openLinks}</div>` : ''}
            <div class="detail-progress">${progressControlsHtml(r, index)}</div>
            <div class="detail-stars">${starsText(r.rating)}</div>
            ${(r.startDate || r.endDate) ? `<div class="detail-dates">
                ${r.startDate ? `<span style="color:#2ecc71;">시작 ${escapeHtml(r.startDate)}</span>` : ''}
                ${r.endDate ? `<span style="color:#e74c3c;">끝 ${escapeHtml(r.endDate)}</span>` : ''}
            </div>` : ''}
            ${r.comment ? `<div class="comment-text">${escapeHtml(r.comment)}</div>` : ''}
            <div class="detail-section-title">創作團隊</div>
            ${creators ? `<dl class="creator-list">${creators}</dl>` : '<div style="color:#555;">未填寫創作者資訊</div>'}
            ${relations ? `<div class="detail-section-title">合作過的其他作品</div>${relations}` : ''}
        `;
    }

    function openDetail(index, replace = false) {
        currentEditIndex = index;
        setEditMode(false);
        renderDetailView(index);
        document.getElementById('detailBody').scrollTop = 0;
        if (!replace) Sheets.open('detailSheet');
    }

    function setEditMode(edit) {
        isEditMode = edit;
        document.getElementById('viewModeArea').hidden = edit;
        document.getElementById('editModeArea').hidden = !edit;
        document.getElementById('editFooter').hidden = !edit;
        document.getElementById('editModeBtn').hidden = edit;
    }

    function enterEditMode() {
        editForm.setData(allReviews[currentEditIndex]);
        setEditMode(true);
        document.getElementById('detailBody').scrollTop = 0;
    }

    function cancelEdit() {
        if (editForm.isDirty() && !confirm('放棄尚未儲存的修改？')) return;
        setEditMode(false);
    }

    function saveChanges() {
        const data = editForm.getData();
        if (!data.title.trim()) return alert('請輸入漫畫名稱！');
        const now = new Date();
        allReviews[currentEditIndex] = { ...allReviews[currentEditIndex], ...data, updatedAt: now.toLocaleString(), updatedAtTs: now.getTime() };
        Store.saveReviews(allReviews);
        editForm.markClean();
        renderAll();
        renderDetailView(currentEditIndex);
        setEditMode(false);
    }

    function deleteCurrentReview() {
        const title = allReviews[currentEditIndex].title || '未命名';
        if (!confirm(`確定要刪除《${title}》的所有紀錄嗎？`)) return;
        allReviews.splice(currentEditIndex, 1);
        Store.saveReviews(allReviews);
        editForm.markClean();
        setEditMode(false);
        Sheets.closeTop();
        renderAll();
    }

    // ---------- 備份 / 匯入 / 清除 ----------
    function downloadBackup() {
        const packageData = { reviews: allReviews, memo: Store.loadMemo() };
        const blob = new Blob([JSON.stringify(packageData, null, 2)], { type: 'application/json' });
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const timeStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `comic_reviews_all_backup_${timeStr}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    document.getElementById('filePicker').addEventListener('change', async e => {
        const files = Array.from(e.target.files);
        e.target.value = ''; // 讓同一個檔案可以再次選取
        let changed = false;
        for (const file of files) {
            let imported;
            try {
                imported = JSON.parse(await file.text());
            } catch (err) {
                alert(`「${file.name}」不是有效的 JSON 檔，已略過。`);
                continue;
            }
            if (imported.reviews || imported.hasOwnProperty('memo')) {
                const count = (imported.reviews || []).length;
                if (!confirm(`「${file.name}」是完整備份（${count} 部）。\n匯入會取代目前的 ${allReviews.length} 部漫畫與備忘錄，確定嗎？`)) continue;
                allReviews = imported.reviews || [];
                Store.saveMemo(imported.memo || '');
            } else {
                const added = Array.isArray(imported) ? imported : [imported];
                allReviews = allReviews.concat(added);
                alert(`已從「${file.name}」加入 ${added.length} 部漫畫。`);
            }
            changed = true;
        }
        if (!changed) return;
        migrateReviews(allReviews);
        Store.saveReviews(allReviews);
        document.getElementById('memoArea').value = Store.loadMemo();
        Sheets.closeTop();
        renderAll();
    });

    function clearAllData() {
        const answer = prompt(`這會刪除全部 ${allReviews.length} 部漫畫與備忘錄，且無法復原。\n建議先下載備份。確定要清除請輸入「刪除」：`);
        if (answer !== '刪除') return;
        allReviews = [];
        Store.saveReviews(allReviews);
        Store.saveMemo('');
        document.getElementById('memoArea').value = '';
        Sheets.closeTop();
        renderAll();
    }

    // ---------- 備忘錄 ----------
    const memoArea = document.getElementById('memoArea');
    function autoResizeMemo() {
        memoArea.style.height = 'auto';
        memoArea.style.height = memoArea.scrollHeight + 'px';
    }
    memoArea.addEventListener('input', () => {
        Store.saveMemo(memoArea.value);
        autoResizeMemo();
    });

    // ---------- 初始化 ----------
    function renderAll() {
        buildFilterOptions();
        renderStatusChips();
        renderList();
        renderWeekly();
        renderStats();
    }

    memoArea.value = Store.loadMemo();
    renderAll();
    switchTab(ui.tab);
</script>
</body>
</html>
