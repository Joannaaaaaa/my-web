<script src="common.js?v=20260926-4"></script>
<script>
    let allReviews = Store.loadReviews();
    const ui = Object.assign({ tab: 'list', status: 'all', platform: 'all', studio: 'all', sort: 'added', view: 'list' }, Store.loadUi());
    let currentEditIndex = -1;
    let isEditMode = false;

    const editForm = createReviewForm(document.getElementById('editModeArea'));

    // ---------- 彈出視窗管理：支援手機返回手勢關閉 ----------
    const Sheets = {
        stack: [],
        guards: {},
        open(id) {
            if (this.stack.includes(id)) return;
            this.stack.push(id);
            this.show(id, true);
            history.pushState({ sheet: id }, '');
        },
        closeTop() {
            if (this.stack.length) history.back();
        },
        // 瀏覽器返回時呼叫；guard 回傳 false 代表使用者取消關閉
        onPopState() {
            const id = this.stack[this.stack.length - 1];
            if (!id) return;
            if (this.guards[id] && !this.guards[id]()) {
                history.pushState({ sheet: id }, '');
                return;
            }
            this.stack.pop();
            this.show(id, false);
        },
        show(id, visible) {
            const el = document.getElementById(id);
            el.classList.toggle('open', visible);
            el.style.zIndex = visible ? 100 + this.stack.indexOf(id) : ''; // 後開的疊在上面
            const anyBottomSheet = this.stack.some(s => document.getElementById(s).classList.contains('sheet'));
            document.getElementById('backdrop').classList.toggle('open', anyBottomSheet || (this.stack.length > 0 && window.innerWidth >= 700));
            document.body.classList.toggle('no-scroll', this.stack.length > 0);
        },
    };
    window.addEventListener('popstate', () => Sheets.onPopState());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') Sheets.closeTop(); });
    Sheets.guards.detailSheet = () => !(isEditMode && editForm.isDirty()) || confirm('尚未儲存的修改會遺失，確定要離開嗎？');

    // ---------- 分頁 ----------
    function switchTab(tab) {
        ui.tab = tab;
        Store.saveUi(ui);
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        if (tab === 'weekly') autoResizeMemo();
        window.scrollTo(0, 0);
    }

    // ---------- 篩選 ----------
    function buildFilterOptions() {
        const platformCounts = {};
        const studios = new Set();
        allReviews.forEach(r => {
            (r.platforms || []).forEach(p => { platformCounts[p.trim()] = (platformCounts[p.trim()] || 0) + 1; });
            splitNames(r.studio).forEach(s => studios.add(s));
        });

        const platformSelect = document.getElementById('platformFilter');
        platformSelect.innerHTML = '<option value="all">所有平台</option>' +
            Object.keys(platformCounts).sort().map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}（${platformCounts[p]} 部）</option>`).join('');
        const studioSelect = document.getElementById('studioFilter');
        studioSelect.innerHTML = '<option value="all">所有製作團隊</option>' +
            Array.from(studios).sort().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

        // 保存的篩選值若已不存在（例如刪掉最後一部），就回到「全部」
        const has = (sel, v) => Array.from(sel.options).some(o => o.value === v);
        if (!has(platformSelect, ui.platform)) ui.platform = 'all';
        if (!has(studioSelect, ui.studio)) ui.studio = 'all';
        platformSelect.value = ui.platform;
        studioSelect.value = ui.studio;
        document.getElementById('sortSelect').value = ui.sort;
    }

    function renderStatusChips() {
        const counts = { all: allReviews.length };
        STATUSES.forEach(s => { counts[s] = allReviews.filter(r => (r.status || DEFAULT_STATUS) === s).length; });
        document.getElementById('statusChips').innerHTML = ['all', ...STATUSES].map(s => `
            <button class="chip ${ui.status === s ? 'selected' : ''}" onclick="setStatusFilter('${s}')">
                ${s === 'all' ? '全部' : s} ${counts[s]}
            </button>`).join('');
    }

    function setStatusFilter(status) {
        ui.status = status;
        Store.saveUi(ui);
        renderStatusChips();
        renderList();
    }

    function onFilterChange() {
        ui.platform = document.getElementById('platformFilter').value;
        ui.studio = document.getElementById('studioFilter').value;
        ui.sort = document.getElementById('sortSelect').value;
        Store.saveUi(ui);
        renderList();
    }

    function resetFilters() {
        Object.assign(ui, { status: 'all', platform: 'all', studio: 'all', sort: 'added' });
        Store.saveUi(ui);
        document.getElementById('searchInput').value = '';
        buildFilterOptions();
        renderStatusChips();
        renderList();
    }

    function clearSearch() {
        const input = document.getElementById('searchInput');
        input.value = '';
        renderList();
        input.focus();
    }

    const SEARCH_FIELDS = ['title', 'krTitle', 'note', 'comment', ...JOB_KEYS.map(j => j.key)];

    function getFilteredIndexes() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const indexes = allReviews.map((_, i) => i).filter(i => {
            const r = allReviews[i];
            if (ui.status !== 'all' && (r.status || DEFAULT_STATUS) !== ui.status) return false;
            if (ui.platform !== 'all' && !(r.platforms || []).includes(ui.platform)) return false;
            if (ui.studio !== 'all' && !splitNames(r.studio).includes(ui.studio)) return false;
            if (query && !SEARCH_FIELDS.some(f => String(r[f] || '').toLowerCase().includes(query))
                && !(r.notes || []).some(n => (n.text || '').toLowerCase().includes(query))) return false;
            return true;
        });

        const by = {
            'added-desc': (a, b) => b - a,
            'updated': (a, b) => (allReviews[b].updatedAtTs || 0) - (allReviews[a].updatedAtTs || 0) || b - a,
            'rating': (a, b) => ratingValue(allReviews[b].rating) - ratingValue(allReviews[a].rating),
            'start': (a, b) => (allReviews[b].startDate || '').localeCompare(allReviews[a].startDate || ''),
            'end': (a, b) => (allReviews[b].endDate || '').localeCompare(allReviews[a].endDate || ''),
            'backlog': (a, b) => (backlogOf(allReviews[b]) ?? -1) - (backlogOf(allReviews[a]) ?? -1),
            'title': (a, b) => (allReviews[a].title || '').localeCompare(allReviews[b].title || '', 'zh-Hant'),
        }[ui.sort];
        return by ? indexes.sort(by) : indexes;
    }

    // ---------- 作品列表 ----------
    function creatorsSummary(r) {
        return JOB_KEYS.filter(j => (r[j.key] || '').trim())
            .map(j => `<b>${j.label}</b> ${escapeHtml(r[j.key].trim())}`).join(' · ');
    }

    function statusBadgeHtml(r) {
        const status = r.status || DEFAULT_STATUS;
        let day = status === DEFAULT_STATUS && DAY_MAP[r.updateDay] ? ` · ${DAY_MAP[r.updateDay]}` : '';
        if (status === '休刊') {
            const st = returnStatus(r);
            day = {
                upcoming: st.exact ? ` · ${st.days} 天後回歸` : ` · ${r.returnText}`,
                today: ' · 今天回歸', due: ' · 已到回歸日', window: ' · 回歸期間中', overdue: ' · 已超過預計時間',
                unknown: r.returnText ? ` · ${r.returnText}` : '',
            }[st.state];
        }
        return `<span class="status-badge ${STATUS_CONFIG[status]?.cls || 'status-ongoing'}">${escapeHtml(status)}${day}</span>`;
    }

    function renderList() {
        const query = document.getElementById('searchInput').value;
        document.getElementById('searchClear').hidden = !query;

        const indexes = getFilteredIndexes();
        const filtersActive = ui.status !== 'all' || ui.platform !== 'all' || ui.studio !== 'all' || query.trim() !== '';
        document.getElementById('filterBtn').classList.toggle('active', ui.platform !== 'all' || ui.studio !== 'all' || ui.sort !== 'added');
        document.getElementById('resetFiltersBtn').hidden = !(filtersActive || ui.sort !== 'added');
        document.getElementById('resultCount').textContent = filtersActive
            ? `顯示 ${indexes.length} / ${allReviews.length} 部`
            : `共 ${allReviews.length} 部`;
        document.getElementById('totalCount').textContent = allReviews.length ? `${allReviews.length} 部` : '';

        const gallery = document.getElementById('gallery');
        const wall = ui.view === 'grid';
        gallery.classList.toggle('cover-wall', wall);
        const viewBtn = document.getElementById('viewBtn');
        viewBtn.textContent = wall ? '☰' : '▦';
        viewBtn.setAttribute('aria-label', wall ? '切換成清單' : '切換成封面牆');
        document.getElementById('emptyMsg').hidden = indexes.length > 0;
        if (wall) {
            gallery.innerHTML = indexes.map(i => wallTileHtml(allReviews[i], i)).join('');
            return;
        }

        gallery.innerHTML = indexes.map(i => {
            const r = allReviews[i];
            const dates = [r.startDate && `시작 ${escapeHtml(r.startDate)}`, r.endDate && `끝 ${escapeHtml(r.endDate)}`].filter(Boolean).join('　');
            const creators = creatorsSummary(r);
            const relations = findRelations(r).map(g =>
                `<div><b>🔗 ${g.label}</b>${escapeHtml(g.matches.map(m => m.title).join('、'))}</div>`).join('');
            return `
                <article class="review-card" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if (event.key === 'Enter') openDetail(${i})">
                    ${coverHtml(r, coverUrlOf(r), 'md')}
                    <div class="card-body">
                    <div class="card-top">
                        <div style="min-width:0;">
                            <h3 class="comic-title">${escapeHtml(r.title || '未命名')}${episodeBadgeHtml(r)}</h3>
                            ${r.krTitle ? `<div class="comic-kr-title">${escapeHtml(r.krTitle)}</div>` : ''}
                            ${r.note ? `<div class="item-note card-note">📌 ${escapeHtml(r.note)}</div>` : ''}
                        </div>
                        <div class="card-stars">${starsHtml(r.rating)}</div>
                    </div>
                    <div class="card-meta">${statusBadgeHtml(r)} ${platformLinkTagsHtml(r)}</div>
                    ${creators ? `<div class="card-creators">${creators}</div>` : ''}
                    ${relations ? `<div class="card-relations">${relations}</div>` : ''}
                    ${dates ? `<div class="card-dates">${dates}</div>` : ''}
                    </div>
                </article>`;
        }).join('');
    }

    // 封面牆的一格：封面（左上狀態、右上待補）＋標題＋話數
    const STATUS_SHORT = { '連載中': '連載', '已看完': '看完', '休刊': '休刊', '棄坑': '棄坑', '想看': '想看' };
    function wallTileHtml(r, i) {
        const status = STATUS_CONFIG[r.status] ? r.status : DEFAULT_STATUS;
        const backlog = backlogOf(r);
        const sub = [status === DEFAULT_STATUS && DAY_MAP[r.updateDay] ? DAY_MAP[r.updateDay] : '', episodeLabel(r.episode)].filter(Boolean).join(' · ');
        return `
            <article class="wall-tile" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if (event.key === 'Enter') openDetail(${i})">
                <div class="wall-cover">
                    ${coverHtml(r, coverUrlOf(r), 'fill')}
                    <span class="status-badge wall-status ${STATUS_CONFIG[status].cls}">${STATUS_SHORT[status]}</span>
                    ${backlog ? `<span class="wall-backlog">待補 ${backlog}</span>` : ''}
                </div>
                <div class="wall-title">${escapeHtml(r.title || '未命名')}</div>
                ${sub ? `<div class="wall-sub">${escapeHtml(sub)}</div>` : ''}
            </article>`;
    }

    function toggleView() {
        ui.view = ui.view === 'grid' ? 'list' : 'grid';
        Store.saveUi(ui);
        renderList();
    }

    // ---------- 本週更新 ----------
    const DAY_FULL = { Mon: '월요일', Tue: '화요일', Wed: '수요일', Thu: '목요일', Fri: '금요일', Sat: '토요일', Sun: '일요일' };
    const DAY_ZH = { Mon: '週一', Tue: '週二', Wed: '週三', Thu: '週四', Fri: '週五', Sat: '週六', Sun: '週日' };
    const todayCode = () => DAYS[(new Date().getDay() + 6) % 7];
    let selectedDay = todayCode();

    function comicsOn(day) {
        return allReviews.map((r, i) => ({ r, i }))
            .filter(({ r }) => (r.status || DEFAULT_STATUS) === DEFAULT_STATUS && r.updateDay === day);
    }

    function renderWeekly() {
        const today = todayCode();
        document.getElementById('dayStrip').innerHTML = DAYS.map(day => {
            const list = comicsOn(day);
            const n = list.length;
            const allRead = n > 0 && list.every(({ r }) => isReadThisWeek(r));
            const cls = [day === today && 'today', day === selectedDay && 'selected', !n && 'empty'].filter(Boolean).join(' ');
            return `<button class="day-btn ${cls}" role="tab" aria-selected="${day === selectedDay}" onclick="selectDay('${day}')">
                <span class="day-name">${DAY_MAP[day]}</span><span class="day-count">${allRead ? '✓' : (n || '·')}</span></button>`;
        }).join('');

        const items = comicsOn(selectedDay);
        const readCount = items.filter(({ r }) => isReadThisWeek(r)).length;
        document.getElementById('dayHeadingTitle').textContent =
            `${DAY_FULL[selectedDay]}${selectedDay === today ? '・今天' : ''}`;
        document.getElementById('dayHeadingSub').textContent = items.length ? `${items.length} 部更新・已讀 ${readCount}` : '';
        document.getElementById('dayList').innerHTML = items.length ? items.map(({ r, i }) => {
            const read = isReadThisWeek(r);
            return `
            <div class="day-item ${read ? 'read' : ''}" role="button" tabindex="0" onclick="openDetail(${i})" onkeydown="if (event.key === 'Enter') openDetail(${i})">
                ${coverHtml(r, coverUrlOf(r), 'sm')}
                <div class="day-item-main">
                    <div class="title-line"><div class="day-item-title">${escapeHtml(cleanTitleBrackets(r.title) || '未命名')}</div>${episodeBadgeHtml(r)}</div>
                    ${r.krTitle ? `<div class="day-item-kr">${escapeHtml(r.krTitle)}</div>` : ''}
                    ${r.note ? `<div class="item-note">📌 ${escapeHtml(r.note)}</div>` : ''}
                    <div class="day-item-progress">${progressControlsHtml(r, i)}
                        <button class="read-pill ${read ? 'on' : ''}" onclick="event.stopPropagation(); toggleRead(${i})" aria-pressed="${read}">✓ 已讀</button>
                    </div>
                </div>
                <div class="day-item-links">${platformLinkTagsHtml(r)}</div>
            </div>`;
        }).join('')
            : `<div class="day-empty">${DAY_ZH[selectedDay]}沒有連載中的作品</div>`;
    }

    // ---------- 休刊回歸 ----------
    function pausedWorks() {
        return allReviews.map((r, i) => ({ r, i })).filter(({ r }) => r.status === '休刊');
    }

    const RESUME_BUTTON = i => `<button class="btn btn-primary" style="min-height:36px; padding:0 12px; font-size:0.82rem;" onclick="event.stopPropagation(); resumeSerial(${i})">改為連載中</button>`;

    // 依最早可能回歸的時間排序，未定的放最後
    function renderReturns() {
        const paused = pausedWorks().sort((a, b) =>
            (a.r.returnFrom || '9999').localeCompare(b.r.returnFrom || '9999'));
        document.getElementById('returnPanel').hidden = paused.length === 0;
        document.getElementById('returnList').innerHTML = paused.map(({ r, i }) => {
            const st = returnStatus(r);
            const range = returnRangeLabel(r.returnFrom, r.returnTo);
            const text = escapeHtml(r.returnText || '');
            const when = {
                unknown: text || '回歸時間未定',
                upcoming: st.exact ? range : `${text}（${range}）`,
                today: '今天回歸 🎉',
                due: `${range} 已到回歸日`,
                window: `預計回歸期間中・${text}（${range}）`,
                overdue: `已超過預計時間・${text}（${range}）`,
            }[st.state];
            const side = {
                unknown: '',
                upcoming: `<div class="return-count"><b>${st.days}</b><small>${st.exact ? '天後' : '天後起'}</small></div>`,
                window: '<span class="return-pill">期間中</span>',
            }[st.state] ?? RESUME_BUTTON(i);
            return `
                <div class="return-item ${st.state === 'unknown' ? 'unknown' : ''}" role="button" tabindex="0" onclick="openDetail(${i})">
                    <div class="return-main">
                        <div class="day-item-title">${escapeHtml(r.title || '未命名')}</div>
                        <div class="return-when ${['today', 'due', 'window', 'overdue'].includes(st.state) ? 'due' : ''}">${when}</div>
                    </div>
                    ${side}
                </div>`;
        }).join('');
        renderReturnBanner();
    }

    // 首頁上方提醒：確定日期到了（按 ✕ 當天不再顯示）；區間只在剛進入時提醒一次（按 ✕ 後就不再提醒）
    function returnKey(r) { return `${r.title}|${r.returnFrom}`; }

    function renderReturnBanner() {
        const today = toDateStr(new Date());
        const acked = ui.returnAck || [];
        const due = pausedWorks().filter(({ r }) => {
            const st = returnStatus(r).state;
            if (st === 'today' || st === 'due') return ui.returnDismissed !== today;
            if (st === 'window') return !acked.includes(returnKey(r));
            return false;
        });
        const banner = document.getElementById('returnBanner');
        if (!due.length) {
            banner.hidden = true;
            return;
        }
        const one = due[0].r, st = returnStatus(one).state;
        const text = due.length === 1
            ? `🎉《${escapeHtml(cleanTitleBrackets(one.title))}》${{ today: '今天回歸', due: '已到回歸日', window: `進入預計回歸期間（${escapeHtml(one.returnText)}）` }[st]}`
            : `🎉 有 ${due.length} 部休刊作品到了回歸時間`;
        banner.innerHTML = `
            <div class="return-banner-inner">
                <span>${text}</span>
                <button class="btn btn-primary" onclick="showReturns()">查看</button>
                <button class="icon-btn" style="width:36px;height:36px;font-size:1rem;" onclick="dismissReturnBanner()" aria-label="不再提醒">✕</button>
            </div>`;
        banner.hidden = false;
    }

    function showReturns() {
        switchTab('weekly');
        document.getElementById('returnPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function dismissReturnBanner() {
        ui.returnDismissed = toDateStr(new Date());
        const windowKeys = pausedWorks().filter(({ r }) => returnStatus(r).state === 'window').map(({ r }) => returnKey(r));
        ui.returnAck = [...new Set([...(ui.returnAck || []), ...windowKeys])];
        Store.saveUi(ui);
        renderReturnBanner();
    }

    // 改回連載中，並直接打開編輯讓使用者選更新日
    function resumeSerial(i) {
        const r = allReviews[i];
        freezeLatest(r); // 從今天開始重新自動 +1，休刊期間不算
        r.status = DEFAULT_STATUS;
        Object.assign(r, { returnText: '', returnFrom: '', returnTo: '' });
        Store.saveReviews(allReviews);
        renderAll();
        openDetail(i);
        enterEditMode();
        showToast(`《${cleanTitleBrackets(r.title)}》已改為連載中，請選擇更新日`);
    }

    // ---------- 閱讀進度 ----------
    // 話數標籤＋待補標籤（例如「52話」「待補 3」）
    function episodeBadgeHtml(r) {
        const label = episodeLabel(r.episode);
        const backlog = backlogOf(r);
        return (label ? `<span class="ep-badge">${label}</span>` : '')
            + (backlog ? `<span class="ep-badge backlog-badge">待補 ${backlog}</span>` : '');
    }

    function progressControlsHtml(r, i) {
        // 按鈕文字標出會加在哪一段：+1 話／+1 外傳／+1 後記
        const part = currentEpisodePart(r.episode);
        return episodeLabel(r.episode)
            ? `<button class="ep-plus" onclick="event.stopPropagation(); addEpisode(${i})">+1 ${part.key === 'main' ? '話' : part.label}</button>`
            : `<button class="ep-plus" onclick="event.stopPropagation(); addEpisode(${i})">記錄話數</button>`;
    }

    // 看完一話：話數 +1，並把本週這部標為已讀
    function addEpisode(i) {
        const r = allReviews[i];
        const before = { episode: r.episode && typeof r.episode === 'object' ? { ...r.episode } : r.episode, lastReadDate: r.lastReadDate, latest: r.latest };
        if (episodeLabel(r.episode)) {
            r.episode = stepEpisode(r.episode, 1);
        } else {
            const input = prompt(`《${cleanTitleBrackets(r.title)}》本篇看到第幾話？\n（外傳、後記可以之後在編輯裡填）`);
            if (input === null) return;
            if (!/^\s*\d+\s*$/.test(input)) return alert('請輸入數字');
            r.episode = { main: parseInt(input) };
        }
        if (r.updateDay) r.lastReadDate = weekDateOf(r.updateDay);
        // 看的進度超過記錄的最新話數 → 最新話數跟著更新
        const latest = latestEpisode(r), ep = normalizeEpisode(r.episode);
        if (latest && ep && latest.part === currentEpisodePart(ep).key && ep[latest.part] > latest.n) {
            r.latest = { n: ep[latest.part], part: latest.part, asOf: toDateStr(new Date()) };
        }
        saveProgress();
        showToast(`《${cleanTitleBrackets(r.title)}》${episodeText(r)}`, () => {
            Object.assign(r, before);
            saveProgress();
        }, { label: '寫心得', fn: () => openNoteEditor(i) });
    }

    function toggleRead(i) {
        const r = allReviews[i];
        r.lastReadDate = isReadThisWeek(r) ? '' : weekDateOf(r.updateDay);
        saveProgress();
    }

    // 進度變更不算「編輯」，所以不更新 updatedAt（避免打亂「最近編輯」排序）
    function saveProgress() {
        Store.saveReviews(allReviews);
        renderList();
        renderWeekly();
        if (currentEditIndex >= 0 && document.getElementById('detailSheet').classList.contains('open') && !isEditMode) {
            renderDetailView(currentEditIndex);
        }
    }

    let toastTimer;
    // extra = { label, fn }：額外的按鈕，例如「寫心得」
    function showToast(text, undo, extra) {
        const toast = document.getElementById('toast');
        document.getElementById('toastText').textContent = text;
        const action = document.getElementById('toastAction');
        action.hidden = !undo;
        action.onclick = () => { toast.hidden = true; undo(); };
        const extraBtn = document.getElementById('toastExtra');
        extraBtn.hidden = !extra;
        if (extra) {
            extraBtn.textContent = extra.label;
            extraBtn.onclick = () => { toast.hidden = true; extra.fn(); };
        }
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, extra ? 6000 : 4000);
    }

    function selectDay(day) {
        selectedDay = day;
        renderWeekly();
    }

    // 在清單上左右滑動切換前一天 / 後一天
    (() => {
        const list = document.getElementById('dayList');
        let startX = null, startY = null;
        list.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
        list.addEventListener('touchend', e => {
            if (startX === null) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            startX = null;
            if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const idx = DAYS.indexOf(selectedDay);
            selectDay(DAYS[(idx + (dx < 0 ? 1 : 6)) % 7]);
        });
    })();

    // ---------- 統計 ----------
    // 堆疊順序讓相鄰色塊在色盲下也能區分（紫色的休刊不緊鄰藍色的已看完、粉紅的想看不緊鄰綠色的連載中）
    const CHART_STATUS_ORDER = ['連載中', '已看完', '想看', '棄坑', '休刊'];
    let ratingPlatform = 'all';

    const statusOf = r => STATUS_CONFIG[r.status] ? r.status : DEFAULT_STATUS;
    const onPlatform = (r, p) => p === 'all' || (r.platforms || []).includes(p);
    const pct = (n, total) => total ? Math.round(n / total * 100) : 0;

    function renderStats() {
        renderKpis();
        renderYearReview();
        renderStatusChart();
        renderRatingChart();
        renderStatsTables();
    }

    function renderKpis() {
        const rated = allReviews.filter(r => ratingValue(r.rating) > 0);
        const avg = rated.length ? (rated.reduce((sum, r) => sum + ratingValue(r.rating), 0) / rated.length).toFixed(1) : '–';
        const count = s => allReviews.filter(r => statusOf(r) === s).length;
        const tiles = [
            ['作品總數', allReviews.length, '部'],
            ['平均評分', avg, rated.length ? `/ 5（${rated.length} 部）` : ''],
            ['連載中', count('連載中'), '部'],
            ['已看完', count('已看完'), '部'],
        ];
        document.getElementById('kpiGrid').innerHTML = tiles.map(([label, value, unit]) => `
            <div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}<small>${unit}</small></div></div>`).join('');
    }

    // 一列水平長條：segments = [{ value, color, tip }]，寬度相對於 max
    // 單一長條只在尾端標數字；堆疊長條的色塊夠寬才在裡面標數字
    function barRowHtml(label, segments, max, extraClass = '') {
        const total = segments.reduce((sum, s) => sum + s.value, 0);
        const visible = segments.filter(s => s.value > 0);
        const stackWidth = max ? total / max * 100 : 0;
        const segs = visible.map(s => {
            const share = s.value / max * 100;
            const inner = segments.length > 1 && share >= 9 ? s.value : '';
            return `<button class="bar-seg" style="flex-basis: ${s.value / total * 100}%; background: ${s.color};" data-tip="${escapeHtml(s.tip)}" aria-label="${escapeHtml(s.tip)}">${inner}</button>`;
        }).join('');
        return `
            <div class="bar-row ${extraClass}">
                <span class="bar-label">${label}</span>
                <div class="bar-track">
                    <div class="bar-stack" style="width: ${stackWidth}%;">${segs}</div>
                    <span class="bar-total">${total}</span>
                </div>
            </div>`;
    }

    function renderStatusChart() {
        document.getElementById('statusLegend').innerHTML = CHART_STATUS_ORDER.map(s =>
            `<span class="legend-item"><span class="swatch" style="background: ${STATUS_CONFIG[s].color}"></span>${s}</span>`).join('');

        const rows = [{ key: 'all', label: '全部' }, ...PLATFORMS.map(p => ({ key: p, label: PLATFORM_CONFIG[p].short }))];
        const data = rows.map(row => {
            const list = allReviews.filter(r => onPlatform(r, row.key));
            const segments = CHART_STATUS_ORDER.map(s => {
                const n = list.filter(r => statusOf(r) === s).length;
                return { value: n, color: STATUS_CONFIG[s].color, tip: `${row.label} · ${s}：${n} 部（佔 ${pct(n, list.length)}%）` };
            });
            return { ...row, segments, total: list.length };
        });
        const max = Math.max(...data.map(d => d.total));
        document.getElementById('statusChart').innerHTML = max
            ? data.map(d => barRowHtml(d.label, d.segments, max, d.key === 'all' ? 'overall' : '')).join('')
            : '<div class="chart-empty">還沒有資料</div>';
        setChartInfo('statusInfo', max ? '點長條查看各狀態的數量' : '');
    }

    function renderRatingChart() {
        document.getElementById('ratingPlatformChips').innerHTML = ['all', ...PLATFORMS].map(p => `
            <button class="chip ${ratingPlatform === p ? 'selected' : ''}" onclick="setRatingPlatform('${p}')">
                ${p === 'all' ? '全部平台' : PLATFORM_CONFIG[p].short}
            </button>`).join('');

        const list = allReviews.filter(r => onPlatform(r, ratingPlatform));
        // 半顆星歸在整數那一條：4.5 星算在 4 星
        const rated = list.filter(r => ratingValue(r.rating) > 0);
        const counts = [5, 4, 3, 2, 1].map(n => ({ n, value: list.filter(r => Math.floor(ratingValue(r.rating)) === n).length }));
        const max = Math.max(...counts.map(c => c.value));
        document.getElementById('ratingChart').innerHTML = max
            ? counts.map(c => barRowHtml(`<span class="stars-label">${'★'.repeat(c.n)}</span>`,
                [{ value: c.value, color: 'var(--star)', tip: `${c.n}${c.n < 5 ? `～${c.n}.5` : ''} 星：${c.value} 部（佔已評分的 ${pct(c.value, rated.length)}%）` }], max)).join('')
            : '<div class="chart-empty">這個平台還沒有評分</div>';
        const unrated = list.length - rated.length;
        setChartInfo('ratingInfo', max ? `點長條查看比例${unrated ? `・另有 ${unrated} 部未評分` : ''}` : '');
    }

    function setRatingPlatform(p) {
        ratingPlatform = p;
        renderRatingChart();
    }

    function setChartInfo(id, text) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.hidden = !text;
    }

    // 點（或滑過）長條時，在下方顯示數字並淡化其他色塊
    const TIP_TARGETS = '.bar-seg, .month-col';
    function highlightSegment(seg) {
        const panel = seg.closest('.panel');
        const sameKind = seg.classList.contains('month-col') ? '.month-col' : '.bar-seg';
        panel.querySelectorAll(TIP_TARGETS).forEach(b => b.classList.toggle('dim', b.matches(sameKind) && b !== seg));
        const info = panel.querySelector('.chart-info');
        if (info) info.textContent = seg.dataset.tip;
    }
    document.getElementById('tab-stats').addEventListener('click', e => {
        const seg = e.target.closest(TIP_TARGETS);
        if (seg) highlightSegment(seg);
    });
    document.getElementById('tab-stats').addEventListener('mouseover', e => {
        const seg = e.target.closest(TIP_TARGETS);
        if (seg && matchMedia('(hover: hover)').matches) highlightSegment(seg);
    });

    // ---------- 年度回顧 ----------
    // 「看完」= 狀態為已看完且結束日在該年；「開始追」= 開始日在該年
    const CREATOR_ROLES = ['author', 'adapter', 'storyboard', 'artist'];
    let reviewYear = null;

    function yearOf(dateStr) { return (dateStr || '').slice(0, 4); }

    function renderYearReview() {
        const years = [...new Set(allReviews.flatMap(r => [yearOf(r.startDate), yearOf(r.endDate)]).filter(Boolean))].sort().reverse();
        const content = document.getElementById('yearContent');
        if (!years.length) {
            document.getElementById('yearChips').innerHTML = '';
            content.innerHTML = '<div class="chart-empty">填寫開始／結束日期後，這裡會出現年度回顧</div>';
            return;
        }
        const thisYear = String(new Date().getFullYear());
        if (!years.includes(reviewYear)) reviewYear = years.includes(thisYear) ? thisYear : years[0];
        document.getElementById('yearChips').innerHTML = years.map(y =>
            `<button class="chip ${y === reviewYear ? 'selected' : ''}" onclick="setReviewYear('${y}')">${y}</button>`).join('');

        const finished = allReviews.map((r, i) => ({ r, i })).filter(({ r }) => statusOf(r) === '已看完' && yearOf(r.endDate) === reviewYear);
        const started = allReviews.filter(r => yearOf(r.startDate) === reviewYear);
        const yearWorks = allReviews.filter(r => yearOf(r.startDate) === reviewYear || yearOf(r.endDate) === reviewYear);
        const rated = finished.filter(({ r }) => ratingValue(r.rating) > 0);
        const avg = rated.length ? (rated.reduce((s, { r }) => s + ratingValue(r.rating), 0) / rated.length).toFixed(1) : '–';

        // 每月看完
        const months = Array.from({ length: 12 }, (_, m) => finished.filter(({ r }) => parseInt(r.endDate.slice(5, 7)) === m + 1).length);
        const maxMonth = Math.max(...months);
        const monthChart = maxMonth ? `
            <div class="month-chart">${months.map((n, m) => `
                <button class="month-col" data-tip="${m + 1} 月看完 ${n} 部" aria-label="${m + 1} 月看完 ${n} 部">
                    <span class="month-value">${n || ''}</span>
                    <span class="month-bar" style="height: ${n / maxMonth * 100}px;"></span>
                </button>`).join('')}
            </div>
            <div class="month-axis">${months.map((_, m) => `<span>${m + 1}</span>`).join('')}</div>
            <div class="chart-info">點長條查看每月看完幾部</div>` : '<div class="chart-empty">這一年還沒有看完的作品</div>';

        // 最常看的平台（當年開始或看完的作品）
        const platformCounts = PLATFORMS.map(p => ({ p, n: yearWorks.filter(r => (r.platforms || []).includes(p)).length }))
            .filter(x => x.n).sort((a, b) => b.n - a.n);
        const maxP = platformCounts[0]?.n || 0;
        const platformBars = platformCounts.map(({ p, n }) =>
            barRowHtml(PLATFORM_CONFIG[p].short, [{ value: n, color: platformColor(p), tip: `${p}：${n} 部` }], maxP)).join('');

        // 最常看的創作者
        const creatorCounts = {};
        yearWorks.forEach(r => {
            const names = new Set(CREATOR_ROLES.flatMap(k => splitNames(r[k])));
            names.forEach(n => { creatorCounts[n] = (creatorCounts[n] || 0) + 1; });
        });
        const topCreators = Object.entries(creatorCounts).filter(([, n]) => n > 1)
            .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 5);

        const favorites = finished.filter(({ r }) => ratingValue(r.rating) === 5);

        content.innerHTML = `
            <div class="kpi-grid three">
                <div class="kpi"><div class="kpi-label">看完</div><div class="kpi-value">${finished.length}<small>部</small></div></div>
                <div class="kpi"><div class="kpi-label">開始追</div><div class="kpi-value">${started.length}<small>部</small></div></div>
                <div class="kpi"><div class="kpi-label">看完的平均</div><div class="kpi-value">${avg}<small>${rated.length ? '★' : ''}</small></div></div>
            </div>
            <div class="year-section-title">每月看完</div>
            ${monthChart}
            ${platformBars ? `<div class="year-section-title">最常看的平台</div>${platformBars}` : ''}
            ${topCreators.length ? `<div class="year-section-title">最常看的創作者</div>
                <div class="rank-list">${topCreators.map(([name, n], k) => `
                    <button class="rank-item" data-creator="${escapeHtml(name)}" onclick="openCreator(this.dataset.creator)">
                        <span class="rank-no">${k + 1}</span><span class="rank-name">${escapeHtml(name)}</span><span class="rank-count">${n} 部 ›</span>
                    </button>`).join('')}</div>` : ''}
            ${favorites.length ? `<div class="year-section-title">年度 5 星作品</div>
                <div class="rank-list">${favorites.map(({ r, i }) => `
                    <button class="rank-item" onclick="openDetail(${i})">
                        <span class="rank-no" style="color: var(--star);">★</span><span class="rank-name">${escapeHtml(r.title || '未命名')}</span><span class="rank-count">›</span>
                    </button>`).join('')}</div>` : ''}
        `;
    }

    function setReviewYear(y) {
        reviewYear = y;
        renderYearReview();
    }

    function renderStatsTables() {
        const head = `<tr><th></th>${PLATFORMS.map(p => `<th>${PLATFORM_CONFIG[p].short}</th>`).join('')}</tr>`;
        const cell = n => `<td class="${n === 0 ? 'zero' : ''}">${n}</td>`;
        const count = (pred, p) => allReviews.filter(r => (r.platforms || []).includes(p) && pred(r)).length;

        const statusRows = STATUSES.map(s =>
            `<tr><td class="row-head">${s}</td>${PLATFORMS.map(p => cell(count(r => statusOf(r) === s, p))).join('')}</tr>`).join('');
        const totalRow = `<tr class="total-row"><td class="row-head">Total</td>${PLATFORMS.map(p => `<td>${count(() => true, p)}</td>`).join('')}</tr>`;
        document.getElementById('statusStatsTable').innerHTML = head + statusRows + totalRow;

        const ratingRows = [5, 4, 3, 2, 1].map(n =>
            `<tr><td class="row-head" style="color: var(--star);">${'★'.repeat(n)}</td>${PLATFORMS.map(p => cell(count(r => Math.floor(ratingValue(r.rating)) === n, p))).join('')}</tr>`).join('');
        document.getElementById('ratingStatsTable').innerHTML = head + ratingRows;
    }

    // ---------- 詳細頁 ----------
    function findRelations(review) {
        const groups = [];
        JOB_KEYS.forEach(job => {
            const names = splitNames(review[job.key]);
            if (!names.length) return;
            const seen = new Set();
            const matches = [];
            allReviews.forEach((other, i) => {
                if (other === review || other.title === review.title) return;
                if (!splitNames(other[job.key]).some(n => names.includes(n))) return;
                const title = cleanTitleBrackets(other.title);
                if (title && !seen.has(title)) { seen.add(title); matches.push({ title, index: i }); }
            });
            if (matches.length) groups.push({ label: job.label, matches });
        });
        return groups;
    }

    function renderDetailView(index) {
        const r = allReviews[index];
        const creators = JOB_KEYS.filter(j => (r[j.key] || '').trim())
            .map(j => `<dt>${j.label}</dt><dd>${creatorLinksHtml(r[j.key])}</dd>`).join('');
        const relations = findRelations(r).map(g => `
            <div class="relation-group"><span class="label">${g.label}</span>
                ${g.matches.map(m => `<button class="relation-link" onclick="openDetail(${m.index}, true)">${escapeHtml(m.title)}</button>`).join('')}
            </div>`).join('');

        const openLinks = (r.platforms || []).map(p => {
            const link = platformLink(r, p);
            if (!link) return '';
            return `<a class="open-link" href="${escapeHtml(link.url)}" target="_blank" rel="noopener" style="--tag-color: ${platformColor(p)}"
                aria-label="${link.isSearch ? `在 ${escapeHtml(p)} 搜尋` : `到 ${escapeHtml(p)} 看`}">
                <span class="swatch" style="background: ${platformColor(p)}"></span>
                ${escapeHtml(PLATFORM_CONFIG[p]?.short || p)}<span class="open-link-icon">${link.isSearch ? '🔍' : '↗'}</span></a>`;
        }).join('');

        document.getElementById('detailHeaderTitle').textContent = r.title || '未命名';
        document.getElementById('viewModeArea').innerHTML = `
            <div class="detail-head">
                ${coverHtml(r, coverUrlOf(r), 'lg')}
                <div class="detail-head-text">
                    <h2 class="detail-title">${escapeHtml(r.title || '未命名')}${episodeBadgeHtml(r)}</h2>
                    ${r.krTitle ? `<div class="detail-kr">원제: ${escapeHtml(r.krTitle)}</div>` : ''}
                    ${r.note ? `<div class="item-note" style="font-size:0.85rem;">📌 ${escapeHtml(r.note)}</div>` : ''}
                    <div class="detail-meta">${statusBadgeHtml(r)} ${openLinks ? '' : platformTagsHtml(r.platforms)}</div>
                    ${openLinks ? `<div class="open-links">${openLinks}</div>` : ''}
                    <div class="detail-progress">${progressControlsHtml(r, index)}</div>
                </div>
            </div>
            <div class="detail-stars">${starsHtml(r.rating)}</div>
            ${(r.startDate || r.endDate) ? `<div class="detail-dates">
                ${r.startDate ? `<span style="color:#2ecc71;">시작 ${escapeHtml(r.startDate)}</span>` : ''}
                ${r.endDate ? `<span style="color:#e74c3c;">끝 ${escapeHtml(r.endDate)}</span>` : ''}
            </div>` : ''}
            ${r.comment ? collapsibleHtml(r.comment, 'comment-text', 160) : ''}
            <div class="notes-head">
                <div class="detail-section-title">閱讀筆記${(r.notes || []).length ? `（${r.notes.length}）` : ''}</div>
                <button class="btn notes-add" onclick="openNoteEditor(${index})">＋ 筆記</button>
            </div>
            ${notesTimelineHtml(r, index)}
            <div class="detail-section-title">創作團隊</div>
            ${creators ? `<dl class="creator-list">${creators}</dl>` : '<div style="color:#555;">未填寫創作者資訊</div>'}
            ${relations ? `<div class="detail-section-title">合作過的其他作品</div>${relations}` : ''}
        `;
    }

    // ---------- 長文字收合 ----------
    // 超過 limit 字就先只顯示幾行，按「展開全文」看全部
    function collapsibleHtml(text, cls, limit) {
        if (text.length <= limit) return `<div class="${cls}">${escapeHtml(text)}</div>`;
        const body = `<div class="${cls}"><div class="clamp-body">${escapeHtml(text)}</div></div>`;
        return `<div class="collapsible collapsed">${body}<button class="expand-btn" onclick="event.stopPropagation(); toggleCollapse(this)">展開全文 ▾</button></div>`;
    }

    function toggleCollapse(btn) {
        const box = btn.parentElement;
        const collapsed = box.classList.toggle('collapsed');
        btn.textContent = collapsed ? '展開全文 ▾' : '收合 ▴';
    }

    // ---------- 閱讀筆記 ----------
    function notesTimelineHtml(r, index) {
        const notes = r.notes || [];
        if (!notes.length) return '<div class="note-empty">還沒有筆記，看完幾話後按「＋ 筆記」記下心得</div>';
        return `<div class="note-list">${notes.map((n, k) => {
            const ep = noteEpisodeLabel(n);
            return `
                <div class="note-item" role="button" tabindex="0" onclick="openNoteEditor(${index}, ${k})">
                    <div class="note-meta">${n.date ? `<span>${noteDateLabel(n)}</span>` : '<span>沒有日期</span>'}${ep ? `<span class="ep-badge">${escapeHtml(ep)}</span>` : ''}</div>
                    ${n.text ? collapsibleHtml(n.text, 'note-text', 120) : ''}
                </div>`;
        }).join('')}</div>`;
    }

    let noteTarget = null; // { index, noteIndex }

    // 新增時自動帶入今天日期與目前看到的段落／話數
    function openNoteEditor(index, noteIndex = null) {
        const r = allReviews[index];
        noteTarget = { index, noteIndex };
        let n = noteIndex != null ? r.notes[noteIndex] : null;
        if (!n) {
            const part = currentEpisodePart(r.episode);
            const ep = normalizeEpisode(r.episode) || {};
            n = { date: toDateStr(new Date()), part: part.key, from: ep[part.key] ?? null, to: null, text: '' };
        }
        document.getElementById('noteSheetTitle').textContent = `${noteIndex != null ? '編輯' : '新增'}筆記・${cleanTitleBrackets(r.title)}`;
        document.getElementById('noteDate').value = n.date || '';
        document.getElementById('notePart').value = n.part || 'main';
        document.getElementById('noteFrom').value = n.from ?? '';
        document.getElementById('noteTo').value = n.toEnd ? '' : (n.to ?? '');
        document.getElementById('noteText').value = n.text || '';
        document.getElementById('noteDelete').hidden = noteIndex == null;
        Sheets.open('noteSheet');
        setTimeout(() => document.getElementById('noteText').focus(), 250);
    }

    function readEpisodeInput(id) {
        const v = document.getElementById(id).value.trim();
        return /^\d+$/.test(v) ? Number(v) : null;
    }

    function saveNote() {
        const r = allReviews[noteTarget.index];
        const old = noteTarget.noteIndex != null ? r.notes[noteTarget.noteIndex] : {};
        const toRaw = document.getElementById('noteTo').value.trim();
        const note = {
            date: document.getElementById('noteDate').value,
            part: document.getElementById('notePart').value,
            from: readEpisodeInput('noteFrom'),
            to: readEpisodeInput('noteTo'),
            toEnd: toRaw === '' ? !!old.toEnd && old.from === readEpisodeInput('noteFrom') : false,
            text: document.getElementById('noteText').value.trim(),
        };
        if (!note.text && note.from == null) return alert('請輸入心得或話數');
        r.notes = [...(r.notes || [])];
        if (noteTarget.noteIndex != null) r.notes[noteTarget.noteIndex] = note;
        else r.notes.push(note);
        // 依日期排序，同一天維持輸入順序
        r.notes = r.notes.map((n, k) => ({ n, k })).sort((a, b) => (a.n.date || '').localeCompare(b.n.date || '') || a.k - b.k).map(x => x.n);
        Store.saveReviews(allReviews);
        Sheets.closeTop();
        renderList();
        if (Sheets.stack.includes('detailSheet') && currentEditIndex === noteTarget.index) renderDetailView(noteTarget.index);
    }

    function deleteNote() {
        if (!confirm('刪除這則筆記？')) return;
        const r = allReviews[noteTarget.index];
        r.notes = r.notes.filter((_, k) => k !== noteTarget.noteIndex);
        Store.saveReviews(allReviews);
        Sheets.closeTop();
        if (Sheets.stack.includes('detailSheet')) renderDetailView(noteTarget.index);
    }

    // ---------- 整理舊資料 ----------
    let cleanupPlan = [];

    // 找出標題有括號、或心得裡有日期段落的作品，算出整理後的樣子（還不寫入）
    function buildCleanupPlan() {
        return allReviews.map((r, index) => {
            const t = parseTitleExtras(r);
            const c = parseCommentNotes(r);
            if (!t && !c) return null;
            const flags = [...(t?.flags || []), ...(c?.flags || [])];
            const next = {};
            if (t) {
                next.title = t.title;
                if (t.episode) {
                    if (normalizeEpisode(r.episode)) flags.push(`標題括號裡的話數（${episodeLabel(t.episode)}）與現有話數不同時，保留現有的 ${episodeLabel(r.episode)}`);
                    else next.episode = t.episode;
                }
                if (t.note) next.note = [r.note, t.note].filter(Boolean).join('・');
                if (t.returnFrom && !r.returnFrom) Object.assign(next, { returnText: t.returnText, returnFrom: t.returnFrom, returnTo: t.returnTo });
            }
            if (c) {
                next.comment = c.comment;
                next.notes = [...(r.notes || []), ...c.notes];
            }
            return { index, next, flags, addedNotes: c?.notes || [] };
        }).filter(Boolean);
    }

    function openCleanup() {
        cleanupPlan = buildCleanupPlan();
        const body = document.getElementById('cleanupBody');
        if (!cleanupPlan.length) {
            body.innerHTML = '<div class="empty-msg">沒有需要整理的資料 🎉</div>';
        } else {
            body.innerHTML = `
                <p style="color: var(--text-sub); font-size: 0.88rem; margin: 0 0 12px;">
                    找到 ${cleanupPlan.length} 部可以整理。取消勾選的作品不會變動。<br>
                    套用前會先自動下載一份「整理前備份」，不滿意可以隨時匯入還原。
                </p>
                ${cleanupPlan.map((p, k) => {
                    const r = allReviews[p.index];
                    const n = p.next;
                    const rows = [];
                    if (n.title !== undefined && n.title !== r.title) rows.push(`<div><span class="k">標題</span><span class="old">${escapeHtml(r.title)}</span> → ${escapeHtml(n.title)}</div>`);
                    if (n.episode) rows.push(`<div><span class="k">話數</span>${escapeHtml(episodeLabel(n.episode))}</div>`);
                    if (n.note) rows.push(`<div><span class="k">備註</span>${escapeHtml(n.note)}</div>`);
                    if (n.returnFrom) rows.push(`<div><span class="k">回歸時間</span>${escapeHtml(n.returnText)}（${returnRangeLabel(n.returnFrom, n.returnTo)}）</div>`);
                    if (p.addedNotes.length) {
                        rows.push(`<div><span class="k">總評</span>${n.comment ? escapeHtml(n.comment.slice(0, 30)) + (n.comment.length > 30 ? '…' : '') : '（沒有）'}</div>`);
                        rows.push(`<div><span class="k">筆記 ${p.addedNotes.length} 則</span><ul class="cleanup-notes">${p.addedNotes.map(x =>
                            `<li>${noteDateLabel(x)} ${escapeHtml(noteEpisodeLabel(x) || '')}｜${escapeHtml((x.text || '').slice(0, 24))}</li>`).join('')}</ul></div>`);
                    }
                    p.flags.forEach(f => rows.push(`<div class="cleanup-flag">⚠️ ${escapeHtml(f)}</div>`));
                    return `
                        <div class="cleanup-item">
                            <label class="cleanup-title"><input type="checkbox" data-plan="${k}" checked onchange="updateCleanupButton()">${escapeHtml(r.title)}</label>
                            <div class="cleanup-rows">${rows.join('')}</div>
                        </div>`;
                }).join('')}`;
        }
        updateCleanupButton();
        document.getElementById('cleanupBody').scrollTop = 0;
        Sheets.open('cleanupSheet');
    }

    function checkedCleanupItems() {
        return Array.from(document.querySelectorAll('#cleanupBody input[data-plan]:checked')).map(el => cleanupPlan[el.dataset.plan]);
    }

    function updateCleanupButton() {
        const n = checkedCleanupItems().length;
        const btn = document.getElementById('cleanupApply');
        btn.disabled = n === 0;
        btn.textContent = n ? `下載整理前備份並套用（${n} 部）` : '沒有勾選的作品';
    }

    function toggleAllCleanup() {
        const boxes = document.querySelectorAll('#cleanupBody input[data-plan]');
        const allOn = Array.from(boxes).every(b => b.checked);
        boxes.forEach(b => { b.checked = !allOn; });
        updateCleanupButton();
    }

    async function applyCleanup() {
        const items = checkedCleanupItems();
        if (!items.length) return;
        await downloadBackup('before_cleanup');
        items.forEach(p => { allReviews[p.index] = { ...allReviews[p.index], ...p.next }; });
        Store.saveReviews(allReviews);
        Sheets.closeTop();
        renderAll();
        showToast(`已整理 ${items.length} 部作品，整理前備份已下載`);
    }

    // ---------- 創作者頁 ----------
    function creatorLinksHtml(value) {
        return splitNames(value).map(name =>
            `<button class="creator-name" data-creator="${escapeHtml(name)}" onclick="openCreator(this.dataset.creator)">${escapeHtml(name)}</button>`).join('、');
    }

    function worksByCreator(name) {
        return allReviews.map((r, i) => ({ r, i, roles: JOB_KEYS.filter(j => splitNames(r[j.key]).includes(name)).map(j => j.label) }))
            .filter(w => w.roles.length);
    }

    function openCreator(name) {
        const works = worksByCreator(name);
        const rated = works.filter(w => ratingValue(w.r.rating) > 0);
        const avg = rated.length ? (rated.reduce((s, w) => s + ratingValue(w.r.rating), 0) / rated.length).toFixed(1) : null;
        const roleCounts = {};
        works.forEach(w => w.roles.forEach(role => { roleCounts[role] = (roleCounts[role] || 0) + 1; }));

        document.getElementById('creatorHeaderTitle').textContent = name;
        document.getElementById('creatorBody').innerHTML = `
            <h2 class="detail-title">${escapeHtml(name)}</h2>
            <div class="creator-summary">參與 ${works.length} 部作品${avg ? `・平均評分 ${avg}` : ''}</div>
            <div class="role-chips">${Object.entries(roleCounts).map(([role, n]) => `<span class="role-chip">${role}<b>${n}</b></span>`).join('')}</div>
            ${works.map(({ r, i, roles }) => `
                <div class="work-row" role="button" tabindex="0" onclick="openWorkFromCreator(${i})">
                    ${coverHtml(r, coverUrlOf(r), 'xs')}
                    <div class="work-main">
                        <div class="day-item-title">${escapeHtml(r.title || '未命名')}</div>
                        ${r.krTitle ? `<div class="day-item-kr">${escapeHtml(r.krTitle)}</div>` : ''}
                        <div class="work-roles">${roles.join('・')}</div>
                    </div>
                    <div class="work-side">${statusBadgeHtml(r)}<span class="card-stars">${starsHtml(r.rating)}</span></div>
                </div>`).join('')}
        `;
        document.getElementById('creatorBody').scrollTop = 0;
        // 創作者頁已在下層（創作者 → 作品 → 另一位創作者）：更新內容後退回那一層
        if (Sheets.stack.includes('creatorSheet')) {
            if (Sheets.stack[Sheets.stack.length - 1] !== 'creatorSheet') Sheets.closeTop();
        } else {
            Sheets.open('creatorSheet');
        }
    }

    // 從創作者頁點作品：詳細頁已在下層就換成該作品並回到它，否則在上層打開
    function openWorkFromCreator(i) {
        if (Sheets.stack.includes('detailSheet')) {
            openDetail(i, true);
            Sheets.closeTop();
        } else {
            openDetail(i);
        }
    }

    function openDetail(index, replace = false) {
        currentEditIndex = index;
        setEditMode(false);
        renderDetailView(index);
        document.getElementById('detailBody').scrollTop = 0;
        if (!replace) Sheets.open('detailSheet');
    }

    function setEditMode(edit) {
        isEditMode = edit;
        document.getElementById('viewModeArea').hidden = edit;
        document.getElementById('editModeArea').hidden = !edit;
        document.getElementById('editFooter').hidden = !edit;
        document.getElementById('editModeBtn').hidden = edit;
    }

    function enterEditMode() {
        editForm.setData(allReviews[currentEditIndex]);
        setEditMode(true);
        document.getElementById('detailBody').scrollTop = 0;
    }

    function cancelEdit() {
        if (editForm.isDirty() && !confirm('放棄尚未儲存的修改？')) return;
        setEditMode(false);
    }

    function saveChanges() {
        const data = editForm.getData();
        if (!data.title.trim()) return alert('請輸入漫畫名稱！');
        const error = editForm.validate();
        if (error) return alert(error);
        const now = new Date();
        const oldCoverId = allReviews[currentEditIndex].coverId;
        allReviews[currentEditIndex] = { ...allReviews[currentEditIndex], ...data, updatedAt: now.toLocaleString(), updatedAtTs: now.getTime() };
        Store.saveReviews(allReviews);
        editForm.markClean();
        if (oldCoverId && oldCoverId !== data.coverId) CoverStore.delete(oldCoverId).catch(() => {});
        renderAll();
        renderDetailView(currentEditIndex);
        setEditMode(false);
        if (data.coverId !== oldCoverId) loadCovers();
    }

    function deleteCurrentReview() {
        const title = allReviews[currentEditIndex].title || '未命名';
        if (!confirm(`確定要刪除《${title}》的所有紀錄嗎？`)) return;
        const [removed] = allReviews.splice(currentEditIndex, 1);
        if (removed.coverId) CoverStore.delete(removed.coverId).catch(() => {});
        Store.saveReviews(allReviews);
        editForm.markClean();
        setEditMode(false);
        Sheets.closeTop();
        renderAll();
    }

    // ---------- 備份 / 匯入 / 清除 ----------
    async function downloadBackup(suffix = '') {
        // 封面一起打包成 data URL，匯入時還原
        const covers = {};
        for (const r of allReviews) {
            if (!r.coverId || covers[r.coverId]) continue;
            const blob = await CoverStore.get(r.coverId).catch(() => null);
            if (blob) covers[r.coverId] = await blobToDataUrl(blob);
        }
        const packageData = { reviews: allReviews, memo: Store.loadMemo(), covers };
        const blob = new Blob([JSON.stringify(packageData, null, 2)], { type: 'application/json' });
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const timeStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `comic_reviews_all_backup_${timeStr}${suffix ? '_' + suffix : ''}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    document.getElementById('filePicker').addEventListener('change', async e => {
        const files = Array.from(e.target.files);
        e.target.value = ''; // 讓同一個檔案可以再次選取
        let changed = false;
        for (const file of files) {
            let imported;
            try {
                imported = JSON.parse(await file.text());
            } catch (err) {
                alert(`「${file.name}」不是有效的 JSON 檔，已略過。`);
                continue;
            }
            if (imported.reviews || imported.hasOwnProperty('memo')) {
                const count = (imported.reviews || []).length;
                if (!confirm(`「${file.name}」是完整備份（${count} 部）。\n匯入會取代目前的 ${allReviews.length} 部漫畫與備忘錄，確定嗎？`)) continue;
                allReviews = imported.reviews || [];
                Store.saveMemo(imported.memo || '');
                await CoverStore.clear().catch(() => {});
                for (const [id, dataUrl] of Object.entries(imported.covers || {})) {
                    const blob = await (await fetch(dataUrl)).blob();
                    await CoverStore.put(id, blob).catch(() => {});
                }
            } else {
                const added = Array.isArray(imported) ? imported : [imported];
                allReviews = allReviews.concat(added);
                alert(`已從「${file.name}」加入 ${added.length} 部漫畫。`);
            }
            changed = true;
        }
        if (!changed) return;
        migrateReviews(allReviews);
        Store.saveReviews(allReviews);
        document.getElementById('memoArea').value = Store.loadMemo();
        Sheets.closeTop();
        renderAll();
        loadCovers();
    });

    function clearAllData() {
        const answer = prompt(`這會刪除全部 ${allReviews.length} 部漫畫與備忘錄，且無法復原。\n建議先下載備份。確定要清除請輸入「刪除」：`);
        if (answer !== '刪除') return;
        allReviews = [];
        Store.saveReviews(allReviews);
        Store.saveMemo('');
        CoverStore.clear().catch(() => {});
        coverUrls.forEach(url => URL.revokeObjectURL(url));
        coverUrls.clear();
        document.getElementById('memoArea').value = '';
        Sheets.closeTop();
        renderAll();
    }

    // ---------- 備忘錄 ----------
    const memoArea = document.getElementById('memoArea');
    function autoResizeMemo() {
        memoArea.style.height = 'auto';
        memoArea.style.height = memoArea.scrollHeight + 'px';
    }
    memoArea.addEventListener('input', () => {
        Store.saveMemo(memoArea.value);
        autoResizeMemo();
    });

    // ---------- 初始化 ----------
    function renderAll() {
        buildFilterOptions();
        renderStatusChips();
        renderList();
        renderWeekly();
        renderReturns();
        renderStats();
    }

    // ---------- 封面快取 ----------
    const coverUrls = new Map(); // coverId → object URL

    function coverUrlOf(r) {
        return r.coverId ? coverUrls.get(r.coverId) : null;
    }

    // 從 IndexedDB 讀出所有封面後重畫；cleanup 時順便刪掉沒有作品在用的圖片
    async function loadCovers({ cleanup = false } = {}) {
        let all;
        try { all = await CoverStore.getAll(); } catch (err) { return; }
        const used = new Set(allReviews.map(r => r.coverId).filter(Boolean));
        const draftCover = Store.loadDraft()?.coverId;
        if (draftCover) used.add(draftCover);
        coverUrls.forEach(url => URL.revokeObjectURL(url));
        coverUrls.clear();
        for (const [id, blob] of all) {
            if (used.has(id)) coverUrls.set(id, URL.createObjectURL(blob));
            else if (cleanup) CoverStore.delete(id).catch(() => {});
        }
        renderAll();
        if (currentEditIndex >= 0 && Sheets.stack.includes('detailSheet') && !isEditMode) renderDetailView(currentEditIndex);
    }

    memoArea.value = Store.loadMemo();
    renderAll();
    switchTab(ui.tab);
    loadCovers({ cleanup: true });
</script>
</body>
</html>
