<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1218">
    <title>웹툰</title>
    <script>
        // 程式出錯時在畫面上顯示訊息，而不是整頁空白（放在最前面，common.js 載入失敗也能顯示）
        window.addEventListener('error', e => {
            const box = document.getElementById('fatalError') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatalError' }));
            box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;padding:12px 14px;border-radius:10px;background:#5a1d1d;color:#fff;font:14px/1.5 sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5)';
            box.textContent = '頁面發生錯誤：' + (e.message || e.error) + '（' + (e.filename || '').split('/').pop() + ':' + e.lineno + '）。請重新整理；如果一直出現，請截圖給開發者。';
        });
    </script>
    <link rel="stylesheet" href="common.css?v=20260926-4">
    <style>
        body { padding-bottom: calc(72px + var(--safe-bottom)); }
        body.no-scroll { overflow: hidden; }
        .page { max-width: 1000px; margin: auto; padding: 0 16px; }

        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 8px 4px 16px; max-width: 1000px; margin: auto;
        }
        .app-header h1 { font-size: 1.5rem; margin: 0; }
        .app-header .count { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; margin-left: 6px; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 作品列表：固定在上方的搜尋與狀態列 */
        .list-toolbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(15, 18, 24, 0.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            margin: 0 -16px; padding: 8px 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .search-row { display: flex; gap: 8px; }
        .search-wrap { position: relative; flex: 1; }
        .search-wrap .input { padding-left: 36px; padding-right: 40px; border-radius: 22px; background: var(--card-bg); }
        .search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .search-wrap .clear-btn { position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: none; background: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }
        .filter-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #333; background: var(--card-bg); color: var(--text); font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
        .filter-btn .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); display: none; }
        .filter-btn.active .dot { display: block; }

        .status-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .status-scroller::-webkit-scrollbar { display: none; }
        .status-scroller .chip { flex-shrink: 0; min-height: 36px; border-width: 1px; font-size: 0.85rem; }
        .status-scroller .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: none; }

        .result-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); padding: 10px 0; min-height: 44px; }
        .link-btn { background: none; border: none; color: var(--primary); font-size: 0.8rem; font-weight: bold; cursor: pointer; padding: 8px 0 8px 12px; }

        /* 作品卡片 */
        .gallery-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 700px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; } }

        /* 封面牆 */
        .gallery-grid.cover-wall { grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
        @media (min-width: 700px) { .gallery-grid.cover-wall { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }
        .wall-tile { cursor: pointer; min-width: 0; }
        .wall-tile:active { opacity: 0.8; }
        .wall-cover { position: relative; }
        .cover-fill { width: 100%; height: auto; aspect-ratio: 3 / 4; font-size: 2.2rem; border-radius: 8px; }
        .wall-status { position: absolute; left: 4px; top: 4px; font-size: 0.66rem; padding: 1px 6px; border-radius: 5px; }
        .wall-backlog { position: absolute; right: 4px; top: 4px; font-size: 0.66rem; font-weight: bold; padding: 1px 6px; border-radius: 5px; background: #c8641a; color: #fff; }
        .wall-title {
            margin-top: 6px; font-size: 0.82rem; font-weight: bold; line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .wall-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .view-btn { font-size: 1rem; }
        .review-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 14px; cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%;
        }
        .review-card:active { background: var(--raised); }
        @media (hover: hover) { .review-card:hover { border-color: var(--primary); } }
        .review-card { display: flex; gap: 12px; align-items: flex-start; }
        .card-body { flex: 1; min-width: 0; }
        .detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
        .detail-head .open-links, .detail-head .detail-progress { margin: 10px 0 0; }
        .detail-head-text { flex: 1; min-width: 0; }
        .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
        .comic-title { font-size: 1.02rem; font-weight: bold; color: #fff; margin: 0; line-height: 1.35; border-left: 3px solid var(--primary); padding-left: 8px; }
        .comic-kr-title { font-size: 0.8rem; color: #8a94a6; font-style: italic; margin: 2px 0 0 11px; }
        .card-stars { color: var(--star); font-size: 0.85rem; white-space: nowrap; letter-spacing: -1px; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0 11px; }
        .card-creators {
            font-size: 0.8rem; color: var(--text-sub); margin: 6px 0 0 11px; line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-relations { font-size: 0.8rem; color: #58b6ec; margin: 6px 0 0 11px; line-height: 1.55; }

        .card-dates { font-size: 0.72rem; color: #666; margin: 6px 0 0 11px; }
        .empty-msg { text-align: center; color: #555; padding: 50px 0; }

        /* 可收合的區塊（本週頁、統計頁） */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
        .panel-title { font-size: 0.95rem; font-weight: bold; color: var(--primary); margin: 0 0 10px; }

        /* 本週：星期列 + 當天清單 */
        .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 14px; }
        .day-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            min-height: 56px; border: none; border-radius: 12px; background: transparent; cursor: pointer;
            color: var(--text-sub); font: inherit; position: relative;
        }
        .day-btn .day-name { font-size: 0.95rem; font-weight: bold; }
        .day-btn .day-count { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .day-btn.empty .day-name { color: #4a4f5a; }
        .day-btn.today { box-shadow: inset 0 0 0 1.5px var(--primary); }
        .day-btn.selected { background: var(--primary); color: #fff; }
        .day-btn.selected .day-count { color: rgba(255, 255, 255, 0.85); }
        .day-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .day-heading-title { font-weight: bold; font-size: 1rem; }
        .day-heading-sub { font-size: 0.8rem; color: var(--text-muted); }
        .day-list { touch-action: pan-y; min-height: 120px; }
        .day-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-height: 60px;
            border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .day-item:last-child { border-bottom: none; }
        .day-item:active { background: var(--raised); }
        .day-item-main { flex: 1; min-width: 0; }
        .day-item-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-item-kr { font-size: 0.8rem; color: #8a94a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-item-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; flex-shrink: 0; max-width: 45%; }
        .read-pill {
            min-height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #4a4f5a;
            background: transparent; color: var(--text-muted); font-size: 0.78rem; font-weight: bold; cursor: pointer; position: relative;
        }
        .read-pill::after { content: ''; position: absolute; inset: -7px -4px; } /* 放大點擊範圍 */
        .read-pill.on { background: var(--status-ongoing); border-color: var(--status-ongoing); color: #fff; }
        .day-item.read .day-item-title, .day-item.read .day-item-kr, .day-item.read .ep-badge { opacity: 0.45; }
        .day-item-progress { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 0.8rem; color: var(--text-sub); }
        .ep-plus {
            min-height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--primary);
            background: transparent; color: var(--primary); font-size: 0.78rem; font-weight: bold; cursor: pointer; position: relative;
        }
        .ep-plus::after { content: ''; position: absolute; inset: -7px -4px; } /* 放大點擊範圍 */
        .ep-plus:active { background: rgba(52, 152, 219, 0.15); }
        /* 話數標籤：貼在標題右邊 */
        .ep-badge {
            display: inline-block; flex-shrink: 0; margin-left: 6px; padding: 1px 7px; border-radius: 6px;
            background: rgba(52, 152, 219, 0.18); color: #7cc4f2; font-size: 0.78rem; font-weight: bold;
            line-height: 1.5; vertical-align: 0.12em; white-space: nowrap; font-variant-numeric: tabular-nums;
        }
        .detail-title .ep-badge { font-size: 0.95rem; vertical-align: 0.2em; }
        .backlog-badge { background: rgba(200, 100, 26, 0.2); color: #f0a35e; }
        /* 本週清單標題可換行，話數標籤接在標題後面 */
        .title-line { font-weight: bold; line-height: 1.4; word-break: break-word; }
        .title-line .day-item-title { display: inline; white-space: normal; }

        .toast {
            position: fixed; left: 16px; right: 16px; bottom: calc(140px + var(--safe-bottom)); z-index: 200;
            max-width: 480px; margin: auto; display: flex; align-items: center; gap: 12px;
            padding: 10px 10px 10px 16px; border-radius: 12px; background: #2b303a; color: var(--text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); font-size: 0.9rem; animation: slideUp 0.2s ease-out;
        }
        .toast span { flex: 1; }
        .toast button + button { padding-left: 4px; }
        .toast button { min-height: 40px; padding: 0 12px; border: none; background: none; color: var(--primary); font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        .return-banner {
            display: flex; align-items: center; gap: 8px; max-width: 1000px; margin: 4px auto 0; padding: 0 16px;
        }
        .return-banner-inner {
            flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px;
            background: rgba(138, 112, 200, 0.18); border: 1px solid var(--status-paused); font-size: 0.88rem;
        }
        .return-banner-inner span { flex: 1; }
        .return-banner-inner .btn { min-height: 36px; padding: 0 12px; font-size: 0.82rem; }
        .return-item { display: flex; align-items: center; gap: 12px; padding: 10px 2px; min-height: 56px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .return-item:last-child { border-bottom: none; }
        .return-item:active { background: var(--raised); }
        .return-main { flex: 1; min-width: 0; }
        .return-when { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .return-count { flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
        .return-count b { font-size: 1.3rem; }
        .return-count small { color: var(--text-muted); font-size: 0.75rem; margin-left: 2px; }
        .return-when.due { color: #b9a6ef; font-weight: bold; }
        .return-item.unknown .day-item-title { color: var(--text-sub); }
        .return-pill { flex-shrink: 0; font-size: 0.78rem; font-weight: bold; color: #fff; background: var(--status-paused); border-radius: 12px; padding: 4px 10px; }
        .return-note { font-size: 0.8rem; color: var(--text-muted); padding-top: 8px; }
        .day-empty { color: var(--text-muted); text-align: center; padding: 36px 0; font-size: 0.9rem; }
        .memo-panel .panel-title { color: var(--text-sub); }
        .memo-textarea { width: 100%; min-height: 120px; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.6; resize: none; padding: 0; }
        .memo-textarea:focus { outline: none; }

        /* 統計圖表 */
        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
        .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .kpi-label { font-size: 0.8rem; color: var(--text-muted); }
        .kpi-value { font-size: 1.7rem; font-weight: 600; line-height: 1.2; margin-top: 2px; }
        .kpi-value small { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-left: 2px; }
        .panel-sub { font-size: 0.78rem; color: var(--text-muted); margin: -6px 0 12px; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .bar-row { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; min-height: 40px; }
        .bar-row + .bar-row { margin-top: 4px; }
        .bar-row.overall { padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
        .bar-label { font-size: 0.82rem; color: var(--text-sub); white-space: nowrap; }
        /* 右側預留空間給長條尾端的總數 */
        .bar-track { display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 34px; }
        .bar-stack { display: flex; gap: 2px; height: 22px; flex-shrink: 0; }
        .bar-seg {
            height: 100%; border: none; padding: 0; cursor: pointer; flex: 0 1 auto; min-width: 4px;
            color: #fff; font-size: 0.72rem; font-weight: bold; overflow: visible;
            position: relative;
        }
        .bar-seg:last-child { border-radius: 0 4px 4px 0; }
        .bar-seg.dim { opacity: 0.35; }
        .bar-seg::after { content: ''; position: absolute; inset: -9px 0; } /* 放大點擊範圍 */
        .bar-total { font-size: 0.8rem; color: var(--text-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .chart-info { min-height: 40px; margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--raised); font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; }
        .chart-empty { color: #555; text-align: center; padding: 20px 0; }
        .stars-label { color: var(--star); letter-spacing: -1px; font-size: 0.78rem; }
        .chart-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
        .chart-chips::-webkit-scrollbar { display: none; }
        .chart-chips .chip { min-height: 34px; font-size: 0.8rem; border-width: 1px; flex-shrink: 0; }
        .chart-chips .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: none; }
        .kpi-grid.three { grid-template-columns: repeat(3, 1fr); margin: 0 0 14px; }
        .kpi-grid.three .kpi { background: var(--raised); border: none; padding: 10px 12px; }
        .kpi-grid.three .kpi-value { font-size: 1.4rem; }
        .year-section-title { font-size: 0.85rem; color: var(--text-muted); font-weight: bold; margin: 18px 0 8px; }
        .month-chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; height: 130px; align-items: end; }
        .month-col {
            height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            border: none; background: none; padding: 0; cursor: pointer; font: inherit;
        }
        .month-value { font-size: 0.7rem; color: var(--text-sub); min-height: 16px; font-variant-numeric: tabular-nums; }
        .month-bar { width: 100%; max-width: 20px; border-radius: 4px 4px 0 0; background: var(--status-completed); min-height: 0; }
        .month-col.dim .month-bar { opacity: 0.35; }
        .month-axis { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; border-top: 1px solid var(--border); margin-top: 0; }
        .month-axis span { text-align: center; font-size: 0.68rem; color: var(--text-muted); padding-top: 4px; }
        .rank-list { display: flex; flex-direction: column; }
        .rank-item {
            display: flex; align-items: center; gap: 10px; min-height: 44px; border: none; background: none; width: 100%;
            color: var(--text); font: inherit; text-align: left; cursor: pointer; padding: 0 2px; border-bottom: 1px solid var(--border);
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-item:active { background: var(--raised); }
        .rank-no { width: 18px; color: var(--text-muted); font-size: 0.8rem; text-align: center; font-variant-numeric: tabular-nums; }
        .rank-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-count { color: var(--text-sub); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
        .table-details summary { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; padding: 12px 0 4px; min-height: 44px; }
        .table-details .table-scroll + .table-scroll { margin-top: 12px; }

        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
        .stats-table { width: 100%; min-width: 300px; border-collapse: collapse; font-size: 0.85rem; text-align: center; }
        .stats-table th { background: var(--raised); color: #a1a1aa; padding: 8px 4px; border: 1px solid var(--border); }
        .stats-table td { padding: 8px 4px; border: 1px solid var(--border); }
        .stats-table .row-head { font-weight: bold; color: var(--primary); white-space: nowrap; }
        .stats-table .zero { color: #444; }
        .stats-table .total-row td { background: var(--raised); font-weight: bold; }

        /* 底部分頁列與新增按鈕 */
        .tab-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            display: flex; background: rgba(21, 24, 31, 0.97); border-top: 1px solid var(--border);
            padding-bottom: var(--safe-bottom);
        }
        .tab-bar button {
            flex: 1; height: 56px; border: none; background: none; color: var(--text-muted); cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.72rem;
        }
        .tab-bar button .tab-icon { font-size: 1.25rem; line-height: 1; filter: grayscale(1); opacity: 0.6; }
        .tab-bar button.active { color: var(--primary); font-weight: bold; }
        .tab-bar button.active .tab-icon { filter: none; opacity: 1; }
        .fab {
            position: fixed; right: 16px; bottom: calc(72px + var(--safe-bottom)); z-index: 30;
            width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff;
            font-size: 2rem; line-height: 56px; text-align: center; text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        /* 彈出視窗：底部選單 (sheet) 與全螢幕詳細頁 (fullsheet) */
        .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; display: none; }
        .backdrop.open { display: block; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; display: none;
            max-height: 85vh; overflow-y: auto; background: var(--card-bg); border-radius: 16px 16px 0 0;
            padding: 8px 16px calc(16px + var(--safe-bottom)); max-width: 640px; margin: auto;
        }
        .sheet.open { display: block; animation: slideUp 0.2s ease-out; }
        .sheet-handle { width: 40px; height: 4px; border-radius: 2px; background: #444; margin: 4px auto 12px; }
        .sheet h3 { margin: 0 0 12px; font-size: 1rem; }
        .menu-item {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 0 8px;
            border: none; background: none; color: var(--text); font-size: 1rem; text-align: left; cursor: pointer;
            border-radius: 10px; text-decoration: none;
        }
        .menu-item:active { background: var(--raised); }
        .menu-item.danger { color: var(--danger); }
        .menu-divider { height: 1px; background: var(--border); margin: 6px 0; }
        .sheet .form-section:last-child { margin-bottom: 0; }

        .fullsheet {
            position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
            background: var(--bg);
        }
        .fullsheet.open { display: flex; animation: slideUp 0.22s ease-out; }
        @media (min-width: 700px) {
