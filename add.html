<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1218">
    <title>新增漫畫</title>
    <script>
        // 外觀：在畫面出現前先套用使用者選的深色／淺色，避免閃一下
        try {
            const theme = JSON.parse(localStorage.getItem('my_review_ui') || '{}').theme;
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) {}
        // 程式出錯時在畫面上顯示訊息，而不是整頁空白（放在最前面，common.js 載入失敗也能顯示）
        window.addEventListener('error', e => {
            const box = document.getElementById('fatalError') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatalError' }));
            box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;padding:12px 14px;border-radius:10px;background:#5a1d1d;color:#fff;font:14px/1.5 sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5)';
            box.textContent = '頁面發生錯誤：' + (e.message || e.error) + '（' + (e.filename || '').split('/').pop() + ':' + e.lineno + '）。請重新整理；如果一直出現，請截圖給開發者。';
        });
    </script>
    <link rel="stylesheet" href="common.css?v=20260927-9">
    <style>
        .topbar {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; gap: 4px;
            padding: 6px 8px; padding-top: calc(6px + env(safe-area-inset-top, 0px));
            background: var(--toolbar-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .topbar h1 { font-size: 1.1rem; margin: 0; flex: 1; }
        .page { max-width: 720px; margin: auto; padding: 16px 16px calc(100px + var(--safe-bottom)); }
        .draft-note { font-size: 0.78rem; color: var(--text-muted); text-align: center; margin-top: 8px; }

        .action-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
            display: flex; gap: 10px; justify-content: center;
            padding: 10px 16px calc(10px + var(--safe-bottom));
            background: var(--bar-bg); border-top: 1px solid var(--border);
        }
        .action-bar .btn { flex: 1; max-width: 340px; min-height: 48px; }
        .action-bar .btn-ghost { flex: 0 0 auto; }
    </style>
</head>
<body>

<header class="topbar">
    <a class="icon-btn" href="index.html" aria-label="返回" style="text-decoration:none; font-size:2.2rem;">‹</a>
    <h1>新增漫畫<button class="server-pill" id="serverPill" hidden onclick="Server.wake()"></button></h1>
</header>

<main class="page">
    <div id="reviewForm"></div>
    <div id="draftNote" class="draft-note">草稿會自動保存</div>
</main>

<div class="action-bar">
    <button class="btn btn-ghost" onclick="clearData()">清空</button>
    <button class="btn btn-primary" onclick="saveToGallery()">儲存</button>
</div>

<script src="common.js?v=20260927-9"></script>
<script>
    const form = createReviewForm(document.getElementById('reviewForm'), {
        teamOpen: true,
        onInput: () => {
            Store.saveDraft(form.getData());
            document.getElementById('draftNote').textContent = '草稿已保存';
        },
    });

    const draft = Store.loadDraft();
    if (draft) {
        form.setData(draft);
        document.getElementById('draftNote').textContent = '已還原上次的草稿';
    }

    function saveToGallery() {
        const data = form.getData();
        if (!data.title.trim()) {
            alert('請輸入漫畫名稱！');
            form.focusTitle();
            return;
        }
        const error = form.validate();
        if (error) return alert(error);
        const reviews = Store.loadReviews();
        const now = new Date();
        const review = { id: newWorkId(), ...data, updatedAt: now.toLocaleString(), updatedAtTs: now.getTime() };
        reviews.push(review);
        Store.saveReviews(reviews);
        ActivityLog.add('me', 'added', review);
        Store.clearDraft();
        window.location.href = 'index.html';
    }

    function clearData() {
        if (!confirm('確定要清空所有欄位嗎？')) return;
        Store.clearDraft();
        form.setData({});
        document.getElementById('draftNote').textContent = '草稿會自動保存';
        window.scrollTo(0, 0);
    }

    // 自動填入要用伺服器：打開就先叫醒（file:// 測試時不連）
    if (location.protocol !== 'file:') {
        Server.onChange = () => Server.renderPill(document.getElementById('serverPill'));
        Server.wake();
    }
</script>
</body>
</html>
